schema_version: 1
repo:
  id: containers-dsoxlab-training
  category: containers
  title: Containers, from the Dockerfile to orchestration
  blog_url: https://www.stephane-robert.info/docs/conteneurs/
  issues_url: https://github.com/stephrobert/containers-dsoxlab-training/issues
  description: 'Verifiable labs for the blog''s containerisation course. Every lab is

    graded on the real state of the engine: an image that was built, its

    size, the user that runs it, a container''s mounts, what the application

    answers. The blog teaches, this catalogue proves.


    One and the same FastAPI application runs through the whole path and

    becomes progressively more correct. The learner does not need to know

    how to program: the code is provided, and the work is on the image, the

    runtime, networking, storage, distribution and hardening.

    '
infra:
  provider:
  - kvm
  network: lab-containers
  cidr: 10.10.120.0/24
  hosts:
  - name: docker.lab
    distro: debian13
    role: debian-family
    ram_mb: 2048
    vcpu: 2
    disk_gb: 20
  providers:
    kvm:
      libvirt_uri: qemu:///system
      bridge_name: virbr-cont
sections:
- id: conteneurs-utilisation
  title: Use containers
  description: 'An image and a container are not the same thing, and the lifecycle explains half of the
    failures. Running, inspecting, publishing a port, keeping data: no build yet.'
  labs:
  - docker-verifier-son-moteur
  - docker-premier-conteneur
  - docker-cycle-de-vie
  - container-entrypoint-et-cmd
  - container-signaux-et-pid-1
  - docker-inspecter-un-conteneur
  - docker-anatomie-dune-image
  - reseau-bridge-par-defaut
  - reseau-bridge-dedie
  - reseau-publication-de-ports
  - reseau-interne
  - reseau-diagnostic-dns
  - donnees-volumes-et-montages
  - donnees-permissions-uid-gid
- id: conteneurs-isolation
  title: Measure isolation, and put a container back in service
  description: Namespaces, cgroups and the chain that goes from the CLI to the process, observed rather
    than recited. Then short incidents where the symptom does not name the cause.
  labs:
  - internes-namespaces
  - internes-cgroups-v2
  - internes-stockage-des-images
  - internes-chaine-dexecution
  - container-limite-cpu
  - container-ulimits-et-shm
  - troubleshoot-exit-127
  - troubleshoot-conflit-de-port
  - troubleshoot-permission-refusee
  - troubleshoot-boucle-de-redemarrage
- id: images-construction
  title: Build images
  description: From a first Dockerfile to a non-root multi-stage image, each step measured against the
    previous one.
  labs:
  - images-identifier-image
  - images-ordre-des-couches
  - images-contexte-de-build
  - images-optimiser-la-taille
  - images-migrer-vers-alpine
  - images-build-multi-etapes
  - images-non-root
  - images-healthcheck
