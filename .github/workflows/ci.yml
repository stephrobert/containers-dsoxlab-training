# La CI d'un dépôt de CONTENU : un catalogue de labs, pas un paquet Python.
#
# Rien n'est construit, rien n'est publié. Ce qui est vérifié : que le contrat
# du catalogue tient, que les hooks passent, et que les labs se jouent
# vraiment — avec Docker, sur le runner.
#
# ## Ce que cette CI ne contrôle JAMAIS
#
# Les `labs/*/fixtures/`. Un point de départ peut porter un Dockerfile qui
# tourne en root, un secret en variable d'environnement ou une image non
# épinglée : c'est le sujet de l'exercice. hadolint y rendrait un échec
# permanent, et le seul moyen de le faire taire serait de retirer du lab ce qui
# fait le lab. L'exemplarité est due aux `solution/`, et c'est là que le
# contrôle porte.
#
# ## CodeQL est ici depuis que ce dépôt est PUBLIC
#
# Il en était absent, et pour une raison qui tenait : sur un dépôt privé de
# compte personnel, le code scanning n'est pas disponible sans Advanced
# Security, et le téléversement échoue sur
#
#     Resource not accessible by integration
#
# avec un workflow identique mot pour mot à celui d'un dépôt public où il
# passe. Un job rouge pour une raison extérieure au code masque les échecs
# réels. Mais la condition a disparu : mesuré le 2026-10-30,
# `gh repo view --json visibility` rend PUBLIC sur ce dépôt comme sur ses onze
# frères, dont le catalogue DevSecOps où le job tourne. L'argument ne tient
# donc plus, et le job est ajouté.
#
# ## Les trois analyseurs de la chaîne elle-même
#
# `zizmor`, `actionlint` et `poutine` ne lisent pas le catalogue : ils lisent
# `.github/workflows/`, c'est-à-dire la seule moitié de ce dépôt qui s'exécute
# avec un jeton. Ils sont repris des catalogues frères, où ils sont la porte
# rapide, et ils ne dépendent d'aucun autre job : un workflow fautif se dit en
# vingt secondes, sans attendre que les labs se jouent.
#
# ## Durcissement
#
# Chaque action est épinglée sur un SHA complet avec sa version en commentaire,
# le jeton par défaut n'a aucune permission, chaque job ne prend que ce qu'il
# lui faut, checkout ne persiste jamais d'identifiants, et chaque job est borné
# dans le temps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Refus par défaut : un job déclare ce dont il a besoin, rien ne s'hérite.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Porte rapide sur la chaîne elle-même : analyse statique des workflows.
  zizmor:
    name: Zizmor (analyse statique des workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Dependabot met à jour le SHA de l'ACTION, jamais cet input, qui
          # épingle le BINAIRE : il est donc le seul de la chaîne à vieillir en
          # silence. La version retenue est celle du catalogue DevSecOps, où
          # elle a été mesurée : la 1.26.1 refuse de charger un workflow qui
          # appelle `uses: $/...`, la forme « self-repository » publiée par
          # GitHub en juillet 2026, et échoue sur « malformed uses ref » sans
          # auditer quoi que ce soit.
          #
          # Et 1.30.0, pas plus récent : l'action embarque sa propre table de
          # versions connues, avec le digest de chaque image, et répond
          # « Unknown version » pour tout ce qui est sorti après SA release.
          #
          # Mesuré ici le 2026-10-30 avec zizmor 1.30.0 sur les cinq workflows
          # du dépôt : « No findings to report ».
          version: "1.30.0"
          advanced-security: false
          # Les workflows DU CATALOGUE. Ce dépôt n'en livre pas dans ses labs,
          # mais le dire explicitement garde le périmètre stable le jour où un
          # lab en portera un, volontairement fautif, comme sujet d'exercice.
          inputs: .github/workflows

  # Syntaxe des workflows. actionlint est le seul analyseur qui refuse une
  # portée de permission inexistante (par exemple le tentant mais inconnu
  # `administration: read`) et qui passe shellcheck sur chaque bloc `run:`.
  # Installé depuis l'archive de release épinglée, empreinte SHA-256 vérifiée
  # avant usage : aucun script distant tubé dans un shell, et aucune action
  # tierce de plus dans le périmètre de confiance pour un simple lint.
  actionlint:
    name: Actionlint (syntaxe des workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer actionlint (binaire de release vérifié)
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${workdir}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" actionlint
          sudo install -m 0755 "${workdir}/actionlint" /usr/local/bin/actionlint
          actionlint --version

      - name: Actionlint
        run: actionlint -color

  # Chaînes d'exploitation CI/CD : poutine modélise les déclencheurs, les
  # permissions et les flux de données pour rendre des scénarios d'attaque
  # complets (checkout de code non fiable puis exécution, injection,
  # permissions par défaut trop larges). Il complète zizmor plutôt qu'il ne le
  # répète. Sa configuration vit dans `.poutine.yml`, qui nomme une par une les
  # actions tierces acceptées.
  poutine:
    name: Poutine (chaînes d'exploitation CI/CD)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Poutine
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247 # v1.1.4

  # Porte rapide : les jobs lourds n'ont pas à tourner si le lint échoue.
  lint:
    name: Lint et contrat du catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Installer les dépendances du catalogue
        run: uv sync --frozen

      - name: Ruff, avec les règles du dépôt
        run: uvx ruff check --force-exclude .

      - name: Les vérificateurs du catalogue
        run: uv run --no-sync pytest tests/ -q

      # dsoxlab est un OUTIL, jamais une dépendance de ce dépôt : c'est la
      # règle commune aux six catalogues.
      - name: Le contrat de chaque lab
        run: uvx 'dsoxlab>=0.5.0' validate-structure

      - name: Le catalogue des README est à jour
        run: uv run --no-sync python scripts/gen_catalog.py --check

      # Un verrou qui a dérivé de son pyproject ne verrouille plus rien : les
      # scanners continuent de lire `uv.lock`, qui ne décrit plus ce qui
      # s'installe.
      - name: Le verrou décrit bien le pyproject
        run: uv lock --check

  ancres:
    name: Chaque doc_url ancré pointe une section qui existe
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Le job lit les pages du blog : une politique bloquante demanderait
          # de lister son hôte et son CDN.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Installer les dépendances du catalogue
        run: uv sync --frozen

      # `validate-structure --check-urls` contrôle le code HTTP de la page, pas
      # le fragment. Une ancre fausse donne un lien qui répond 200 et dépose le
      # lecteur en haut d'un guide de mille lignes. Ce contrôle est né après
      # avoir produit 44 ancres fausses sur 64.
      - name: Les ancres des labs, et celles du backlog
        run: uv run --no-sync python scripts/verifier-ancres.py

  dockerfiles:
    name: Hadolint sur les solutions, jamais sur les fixtures
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le binaire de la release épinglée, vérifié par son empreinte publiée
      # avant d'être employé : aucun script distant tubé dans un shell.
      - name: Installer hadolint
        env:
          HADOLINT_VERSION: "2.15.1"
        run: |
          set -euo pipefail
          base="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}"
          curl -fsSL -o /tmp/hadolint "${base}/hadolint-Linux-x86_64"
          curl -fsSL -o /tmp/hadolint.sha256 "${base}/hadolint-Linux-x86_64.sha256" || true
          if [ -s /tmp/hadolint.sha256 ]; then
            awk '{print $1"  /tmp/hadolint"}' /tmp/hadolint.sha256 | sha256sum -c -
          else
            echo "::warning::aucune empreinte publiée pour cette release, binaire non vérifié"
          fi
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version

      - name: Hadolint sur les Dockerfile des solutions
        run: bash scripts/hooks/hadolint-cible.sh

  pre-commit:
    name: Parité pre-commit (tous les hooks)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # les hooks qui parcourent l'historique

      - name: Installer uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # mise pose hadolint, dive et trivy aux versions que `mise.toml` épingle.
      - name: Installer les outils épinglés
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          cache: true

      # Le hook `trufflehog` tourne avec `--no-update` : il refuse d'aller
      # chercher sa propre version, donc elle doit être posée ici, et choisie.
      # L'archive de release est épinglée et son empreinte SHA-256 vérifiée
      # contre les sommes publiées avant usage, plutôt qu'un script distant tubé
      # dans un shell (Plumber ISSUE-411). 3.97.5 est la version mesurée en
      # local le 2026-10-30, pour que le hook juge la même chose des deux côtés.
      - name: Installer trufflehog (binaire de release vérifié)
        env:
          TRUFFLEHOG_VERSION: "3.97.5"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${workdir}/checksums.txt" "${base}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" trufflehog
          sudo install -m 0755 "${workdir}/trufflehog" /usr/local/bin/trufflehog
          trufflehog --version

      - name: Installer les dépendances du catalogue
        run: uv sync --frozen

      - name: Tous les hooks, étape commit
        run: uvx pre-commit@4.6.0 run --all-files --show-diff-on-failure --color always

      - name: Tous les hooks, étape pre-push
        run: uvx pre-commit@4.6.0 run --all-files --hook-stage pre-push --show-diff-on-failure --color always

  labs:
    name: Les labs se jouent vraiment (Docker)
    needs: lint
    runs-on: ubuntu-24.04
    # Chaque lab construit une à plusieurs images et lance des conteneurs :
    # c'est le job long du dépôt, et le seul qui prouve quelque chose sur le
    # contenu. Mesuré en local : 17 s pour un build à froid, 9 s pour le cycle
    # complet d'un lab une fois l'image en cache.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Docker tire ses images de base et pip ses paquets : une politique
          # bloquante demanderait de lister le registre, PyPI et leurs CDN.
          # `audit` enregistre sans couper, et le durcissement de ce job passe
          # par sa permission en lecture seule.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Installer les dépendances du catalogue
        run: uv sync --frozen

      - name: Installer dsoxlab
        run: |
          set -euo pipefail
          uv tool install dsoxlab
          dsoxlab --version

      # Le moteur du runner, et son MODE DE STOCKAGE : les tailles d'image en
      # dépendent, et le verdict l'enregistre. Un runner en classic image store
      # et un poste en containerd ne rendent pas le même chiffre pour la même
      # image, dans un rapport de quatre.
      - name: Ce que le moteur du runner annonce
        run: |
          docker version --format 'moteur {{.Server.Version}}'
          docker info --format 'stockage {{.DriverStatus}}'

      # Ce qui rend `validation-labs.json` opposable : un verdict local qui ne
      # se reproduit pas ici est ROUGE.
      #
      # DEPUIS QUE LES SOLUTIONS SONT CHIFFRÉES, CE REJEU PEUT NE PAS AVOIR LIEU
      #
      # Le cycle pose la solution du formateur sur le répertoire de travail, il
      # lui faut donc le clair. `.vault-pass` n'est pas sur la forge, et c'est
      # la convention de toute la collection : aucun catalogue n'y confie son
      # secret. Le rejeu se déclare alors NON JOUÉ, par un avertissement
      # visible ici, plutôt que de passer pour un succès.
      #
      # Ce qu'on perd est réel et vaut d'être nommé : l'opposabilité du relevé
      # ne tient plus à cette CI, mais à la campagne locale qui l'a produit.
      # C'est la situation des dix autres catalogues de la collection, dont la
      # CI ne rejoue rien non plus.
      - name: Rejouer le cycle « 0 avant, 100 après »
        run: |
          if [ ! -f .vault-pass ]; then
            echo "::warning::rejeu NON JOUÉ : les solutions sont chiffrées et .vault-pass n'est pas sur la forge. La preuve est le validation-labs.json commité, produit en local."
            exit 0
          fi
          uv run --no-sync python scripts/valider-labs.py

      # Le verdict versionné doit couvrir TOUT le catalogue : un lab ajouté
      # sans validation fait échouer ce contrôle, même si les autres verdicts
      # sont verts.
      - name: Le verdict versionné couvre le catalogue et est vert
        run: |
          if [ ! -f .vault-pass ]; then
            echo "::warning::contrôle NON JOUÉ, même raison : il rejoue les solutions pour conclure."
            exit 0
          fi
          uv run --no-sync python scripts/valider-labs.py --check

      - name: Ce que la campagne a changé, s'il y a lieu
        if: always()
        run: git --no-pager diff --stat validation-labs.json

  # Analyse statique du Python du dépôt (tests des labs, conftest, outillage) ET
  # de ses workflows. DEUX langages, et le second n'est pas un ornement : les
  # workflows sont la moitié de ce dépôt qui s'exécute avec un jeton, et
  # n'analyser que le Python la laissait sans surveillance.
  #
  # `security-extended` plutôt que le jeu de requêtes par défaut : le défaut
  # vise le zéro bruit sur un dépôt d'application, ce qui n'est pas le
  # compromis utile ici. C'est déjà le choix du catalogue DevSecOps.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Ni le Python ni les workflows ne se compilent : il n'y a aucun build
          # à observer, et le dire épargne à CodeQL la recherche d'une commande
          # de construction qui n'existe pas.
          build-mode: none
          queries: security-extended
          # Le périmètre est écrit dans ce fichier, qui dit aussi ce qu'il
          # exclut et pourquoi.
          config-file: ./.github/codeql/config.yml

      - name: Analyser
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
