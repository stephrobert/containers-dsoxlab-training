# Les ancres justes a la SOURCE du site, pas encore DEPLOYEES.
#
# POURQUOI CE FICHIER EXISTE
#
# `scripts/verifier-ancres.py` interroge la production. La verite d un `doc_url`
# est dans la source du site, a laquelle la CI de ce depot n a pas acces : une
# ancre peut donc etre signalee fausse ici alors qu elle est juste, simplement
# pas encore servie. Mesure du 2026-11-03 sur les 91 `doc_url` des labs :
# 50 rouges, dont ZERO dette reelle du catalogue. La CI etait rouge en
# permanence et les PR fusionnees par-dessus.
#
# Plutot qu une tolerance implicite, chaque cas est NOMME, DATE et MOTIVE ici.
#
# CE QUI EMPECHE CE FICHIER DE DEVENIR UN DEPOTOIR
#
# Le controle ECHOUE sur une entree devenue inutile : des que l ancre resout en
# production, il exige son retrait ; et si le lab ne porte plus cette ancre,
# il signale l entree morte. Une tolerance qu on oublie de retirer est donc une
# faute, pas un oubli silencieux.
#
# Ce fichier ne se tape pas a la main : il se genere en croisant la production
# et la source, et chaque entree porte sa preuve.

