# Les hooks du catalogue.
#
# Repris de `terraform-dsoxlab-training` et `github-actions-training`, dont la
# CI rejoue exactement cette configuration plutôt qu'une copie : un hook ajouté
# ici est un contrôle ajouté à la CI, et les deux ne peuvent pas diverger.
#
# ## Ce qui est propre à ce dépôt
#
# Rien ici ne lance Docker. Un build prend dix-sept secondes à froid, un lab en
# construit une à plusieurs images, et un hook qui attendrait cela ne serait
# pas lancé. La validation des labs a son script, `scripts/valider-labs.py`, et
# sa place est dans un job de CI dédié.
#
# `scripts/verifier-ancres.py` fait du RÉSEAU : il lit les pages du blog pour
# contrôler que chaque fragment de `doc_url` existe. Il est donc en
# `pre-push`, pas en `pre-commit` — un hook qui échoue dans un train n'apprend
# rien à personne.
#
# ## Deux étapes
#
# `pre-commit` porte ce qui est instantané. `pre-push` porte ce qui coûte :
# `validate-structure` lit tous les labs, et le contrôle des ancres sort sur le
# réseau.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint du python du catalogue)
        # `--force-exclude` n'est pas une précaution : sans lui, l'`exclude` du
        # pyproject est IGNORÉ pour tout fichier passé en argument, et
        # pre-commit passe justement les fichiers en argument. Mesuré sur le
        # catalogue GitHub Actions le 2026-09-25 : ruff a ainsi trié les
        # imports d'une fixture de lab, c'est-à-dire modifié le point de départ
        # livré à l'apprenant, alors que `ruff check .` lancé à la main
        # respectait l'exclusion.
        entry: uvx ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: hadolint
        name: hadolint (les Dockerfile du dépôt, pas ceux des fixtures)
        entry: scripts/hooks/hadolint-cible.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: meta-declare-les-labs
        name: meta.yml et labs/ décrivent le même catalogue
        entry: uv run --no-sync pytest tests/test_meta_declare_les_labs.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: style-apprenant
        name: pas d'emoji ni de tiret cadratin dans ce que l'apprenant lit
        entry: uv run --no-sync pytest tests/test_style_apprenant.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: indices
        name: quatre indices, bilingues, en base64, à coût croissant
        entry: uv run --no-sync pytest tests/test_hints_ecrits.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: assertions-bilingues
        name: ce que l'apprenant lit quand un test refuse existe en EN et en FR
        entry: uv run --no-sync pytest tests/test_assertions_bilingues.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: images-epinglees
        name: les images que les setups tirent sont épinglées par digest
        entry: uv run --no-sync pytest tests/test_images_epinglees.py -q
        language: system
        pass_filenames: false
        always_run: true

      # Une solution lisible dans le dépôt que l'apprenant clone ne gâche pas un
      # lab une fois : git garde l'historique. L'en-tête ansible-vault est la
      # preuve du chiffrement, on la lit plutôt que de faire confiance à
      # l'auteur. Le contrôle tourne SANS `.vault-pass`, donc il est jouable en
      # CI et par n'importe qui.
      - id: solutions-chiffrees
        name: aucune solution de référence ne part en clair
        entry: uv run --no-sync pytest tests/test_solutions_chiffrees.py -q
        language: system
        pass_filenames: false
        always_run: true

      # Un lien interne cassé ne fait échouer aucun test fonctionnel : il ne
      # casse que la navigation, en silence. Le catalogue Ansible jumeau en a
      # relevé 150 d'un coup le jour où le contrôle y a été écrit. Aucun réseau,
      # donc il a sa place dans un hook.
      - id: liens-internes
        name: les liens relatifs des Markdown pointent un fichier existant
        entry: uv run --no-sync pytest tests/test_liens_internes.py -q
        language: system
        pass_filenames: false
        always_run: true

      # Les deux descriptions d'un lab doivent dire la même chose : celle qui
      # s'exécute (test_functional.py) et celle qui se lit (README). Quand la
      # première prouve huit choses et que la seconde annonce « À remplir »,
      # c'est la seconde que l'apprenant croit.
      - id: langue-officielle
        name: un lab écrit ne se déclare pas non écrit
        entry: uv run --no-sync pytest tests/test_langue_officielle.py -q
        language: system
        pass_filenames: false
        always_run: true

      # pytest compte un lab entièrement skippé comme une exécution réussie. Ce
      # contrôle tient le choix de ce catalogue, où un squelette LÈVE : il est
      # rouge tant qu'il n'est pas écrit, jamais vert et muet.
      - id: maturite-des-labs
        name: un squelette ne passe pas pour un lab qui prouve quelque chose
        entry: uv run --no-sync pytest tests/test_maturite_des_labs.py tests/test_capstone_recovery.py -q
        language: system
        pass_filenames: false
        always_run: true

      # trufflehog ne signale que les secrets qu'il a pu VALIDER auprès du
      # service (`--results=verified`). Une clé révoquée, un jeton expiré ou un
      # faux secret pédagogique ne déclenchent donc rien, et restent pourtant
      # dans l'historique d'un dépôt public. Ce contrôle lit les FORMES, et les
      # deux sont complémentaires.
      - id: aucun-jeton-versionne
        name: aucun jeton, clé AWS ou clé privée dans ce que git porte
        entry: uv run --no-sync pytest tests/test_aucun_jeton_versionne.py -q
        language: system
        pass_filenames: false
        always_run: true

      # L'issue #237 de dsoxlab, par l'autre bout : un énoncé qui désigne un
      # endroit où rien n'est lu coûte une demi-heure à qui le suit à la lettre.
      # Ici, ce qu'un énoncé désigne est d'abord la MACHINE, puisque tous les
      # labs sont en `runtime: vm`.
      - id: briefs-pointent-juste
        name: un énoncé ne cite ni hôte ni chemin inexistant
        entry: uv run --no-sync pytest tests/test_briefs_pointent_juste.py -q
        language: system
        pass_filenames: false
        always_run: true

      # Le scan de secrets VALIDÉS, qui complète le contrôle des formes
      # ci-dessus. `--no-update` : la version employée est celle que la CI
      # installe depuis une archive de release vérifiée par son empreinte, pas
      # celle qu'un auto-update ramènerait sans que personne ne la choisisse.
      - id: trufflehog
        name: trufflehog (scan de secrets validés)
        entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --no-update
        language: system
        pass_filenames: false

      - id: outillage-coherent
        name: chaque hook pointe un test, chaque test est câblé
        entry: uv run --no-sync pytest tests/test_outillage_coherent.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-structure
        name: dsoxlab validate-structure
        entry: uvx 'dsoxlab>=0.5.0' validate-structure
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: catalogue-a-jour
        name: le catalogue des README est à jour
        entry: uv run --no-sync python scripts/gen_catalog.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ancres-des-doc-url
        name: chaque doc_url ancré pointe une section qui existe
        # Réseau : `validate-structure --check-urls` contrôle le code HTTP de
        # la page, pas le fragment. Une ancre fausse donne un lien qui répond
        # 200 et dépose le lecteur en haut d'un guide de mille lignes.
        entry: uv run --no-sync python scripts/verifier-ancres.py --labs
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Le verrou porte la version du `pyproject.toml` : la bouger sans
      # relocker le rend périmé. Ce contrôle existait en CI, donc il attrapait
      # l'erreur APRÈS le push. Mesuré le 2026-10-17 : une version bougée sur
      # les douze catalogues a fait rougir les douze CI, là où un hook l'aurait
      # dit au premier commit. Il est instantané et hors ligne.
      - id: verrou-a-jour
        name: uv.lock décrit bien le pyproject
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      # Un verdict ne se commite pas avec ce qu'il mesure. Vecu le 2026-10-22
      # dans deux catalogues, et dans les DEUX SENS : une correction du code
      # partage commitee avec les verdicts qu'elle perimait est passee pour
      # saine, et des labs reattestes sur une branche sont ressortis « a
      # reattester » apres leur fusion en squash, contenu inchange.
      #
      # Le cas qui ne se rattrape JAMAIS : une PR squashee qui retouche un test
      # APRES sa campagne. Le commit unique porte les deux et le squash a
      # detruit ce qui les distinguait. Aucune mesure a posteriori ne peut le
      # voir, ni une date, ni un diff entre deux arbres. Il ne reste qu'a
      # l'empecher.
      - id: verdicts-et-commun-separes
        name: les verdicts ne sont pas commites avec ce qu'ils mesurent
        entry: python3 tests/outils/verdicts_et_commun_separes.py
        language: system
        pass_filenames: false

      # Le garde-fou ci-dessus est lui-meme eprouve, dans les DEUX sens :
      # quatorze cas, ceux qu'il doit refuser et ceux qu'il doit laisser
      # passer. Un garde-fou qui refuserait aussi les commits legitimes se
      # contourne au bout de deux jours, et ne controle alors plus rien.
      - id: garde-fou-des-verdicts-eprouve
        name: le garde-fou des verdicts juge dans les deux sens
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_verdicts_et_commun_separes.py -q
        language: system
        pass_filenames: false
        always_run: true
