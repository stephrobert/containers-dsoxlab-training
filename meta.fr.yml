repo:
  title: Conteneurs, du Dockerfile à l'orchestration
  description: 'Labs vérifiables de la formation Conteneurisation du blog. Chaque lab

    s''éprouve sur l''état réel du moteur : une image construite, sa taille,

    l''utilisateur qui l''exécute, les montages d''un conteneur, ce que

    l''application répond. Le blog enseigne, ce catalogue éprouve.


    Une même application FastAPI traverse tout le parcours et devient

    progressivement plus correcte. L''apprenant n''a pas besoin de savoir

    programmer : le code est fourni, il travaille l''image, l''exécution, le

    réseau, le stockage, la distribution et le durcissement.

    '
sections:
- id: conteneurs-utilisation
  title: Utiliser les conteneurs
  description: 'Image et conteneur ne sont pas la même chose, et le cycle de vie explique la moitié des
    pannes. Lancer, inspecter, publier un port, conserver des données : aucun build pour l''instant.'
- id: conteneurs-isolation
  title: Mesurer l'isolation, et remettre un conteneur en service
  description: Namespaces, cgroups et la chaîne qui va de la CLI au processus, observés et non récités.
    Puis des incidents courts, où le symptôme ne nomme pas la cause.
- id: images-construction
  title: Construire ses images
  description: Du premier Dockerfile à l'image multi-étapes non-root, chaque étape mesurée contre la précédente.
