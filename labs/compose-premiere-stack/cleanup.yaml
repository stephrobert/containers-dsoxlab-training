---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab compose-premiere-stack
  hosts: lab_target
  become: true
  tasks:
    - name: Retirer seulement les ressources du projet Compose de ce lab
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          containers=$(docker container ls -aq --filter label=com.docker.compose.project=dsoxlab-premiere-stack)
          if test -n "$containers"; then docker container rm -f $containers; fi
          networks=$(docker network ls -q --filter label=com.docker.compose.project=dsoxlab-premiere-stack)
          if test -n "$networks"; then docker network rm $networks; fi
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=dsoxlab-premiere-stack)
          if test -n "$volumes"; then docker volume rm $volumes; fi
          images=$(docker image ls -aq --filter label=dsoxlab.lab=compose-premiere-stack)
          if test -n "$images"; then docker image rm -f $images; fi
      changed_when: false

    - name: Retirer les fichiers propres au lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-compose-first
        - /root/.lab-compose-first.json
        - /opt/MISSION.md
