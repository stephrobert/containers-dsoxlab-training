# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB N'A PAS DE FORMULAIRE : la réponse est un script réécrit et un socle
# changé. Le générateur vérifie que les deux premiers indices ne nomment ni les
# constructions fautives ni leur remplacement : les trouver est l'exercice, et
# il suffit de lire le script.
#
# LE PREMIER FAIT LIRE LE MESSAGE, puis vérifier dans l'image que le fichier
# est là. Tenir les deux affirmations ensemble est tout le raisonnement du lab.
#
# LE DEUXIÈME ANNONCE QU'IL Y A DEUX PROBLÈMES, dont le second n'apparaîtra
# qu'une fois le premier réglé. Sans cela, l'apprenant croit avoir fini au
# moment où le conteneur démarre, et cherche ensuite une faute ailleurs.
#
# IL DIT AUSSI QUE LES DEUX VOIES PASSENT : adapter le script ou compléter le
# socle. Le lab défend la première sans la noter, et cacher la seconde serait
# faire croire à une contrainte qui n'existe pas.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-migration.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
