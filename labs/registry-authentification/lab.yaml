# Lab registry-authentification. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: registry-authentification                      # REQUIS
title: "Protect a TLS registry with authentication"
level: c2                     # REQUIS
description: "Require credentials for a private registry and prove authenticated Docker push and pull over verified TLS."
skills:                       # REQUIS, non vide
  - docker
  - registry
  - authentication
  - tls
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/registres/distribution/#configurer-lauthentification   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
