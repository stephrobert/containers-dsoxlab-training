# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DONNE LE CONTENU DES DEUX FICHIERS À ÉCRIRE. Le troisième en donne la
# structure, ce qui est le geste à comprendre, mais pas le texte : un indice qui
# l'écrirait remplacerait la mission au lieu de la débloquer.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sur ce lab, la
# plus sournoise est un montage déclaré sur le MAUVAIS chemin : il existe,
# Compose l'affiche, et il ne monte rien. Le service répond alors la version de
# l'image en développement, ce qui ressemble à un succès.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session (`hints-variantes.py`)
# puis encodés : un indice écrit directement en base64 ne se relit pas, et c'est
# ainsi que deux labs d'un catalogue frère ont été livrés avec les indices du
# générateur.
