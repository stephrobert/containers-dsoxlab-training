# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER DIT L'ORDRE DES GESTES, et c'est sa raison d'être. Sur ce lab, une
# erreur d'ordre est IRRÉVERSIBLE : détruire le conteneur avant d'en sortir le
# fichier perd le fichier. Un indice de premier niveau qui laisserait ce risque
# en place serait une faute : son rôle est de débloquer sans donner la réponse,
# pas de laisser détruire des données.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Il commence par
# la seule faute sans rattrapage, et il la dit franchement, parce qu'un
# apprenant qui cherche un rattrapage inexistant perd son temps.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-volumes.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
