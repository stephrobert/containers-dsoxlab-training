# Épreuve epreuve-durcir-sans-casser. Les champs marqués REQUIS sont exigés par le
# validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue sans
# un mot.
#
# `lab_type: challenge` autorise `exam_passing_score` et dit à l'apprenant que
# cette épreuve ÉVALUE. Rien n'y est réexpliqué : les leçons du module l'ont
# enseigné, à savoir les capabilities, la racine en lecture seule, les secrets,
# et le fait qu'un pare-feu se corrige sans se désactiver.
#
# DEUX EXIGENCES CRITIQUES, et c'est la seule épreuve du catalogue à en porter
# deux : le secret dans l'environnement et le pare-feu désactivé. Les deux sont
# des portes ouvertes, et une porte ouverte ne se compense pas par du travail
# fait ailleurs.
id: epreuve-durcir-sans-casser                      # REQUIS
title: "Harden a service without breaking it"       # REQUIS
level: c6                     # REQUIS
description: "Strip a service of the rights it does not need, make its root read-only with declared writable paths, take its secret out of the environment without losing it, restore a blocked flow without disabling the firewall, and keep the one volume that matters."
skills:                       # REQUIS, non vide
  - docker
  - securite
  - capabilities
  - secrets
  - pare-feu
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/epreuves/durcir-sans-casser/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  - test_le_secret_n_est_ni_dans_l_environnement_ni_dans_l_image
  - test_le_flux_aboutit_et_le_pare_feu_reste_actif
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: droits-reduits
    label: "The service runs with reduced rights and still answers"
    tests:
      - test_le_service_a_perdu_ses_droits_et_repond_encore
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/securite/
  - id: racine-protegee
    label: "The service's filesystem is protected and its legitimate writes still work"
    tests:
      - test_la_racine_est_en_lecture_seule_et_les_ecritures_sont_declarees
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/racine-en-lecture-seule/
  - id: secret-sans-fuite
    label: "The secret reaches the service without sitting in its environment or image"
    tests:
      - test_le_secret_n_est_ni_dans_l_environnement_ni_dans_l_image
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/secrets/
  - id: flux-et-protection
    label: "The expected flow works and the host stays protected"
    tests:
      - test_le_flux_aboutit_et_le_pare_feu_reste_actif
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/reseau-et-pare-feu/
  - id: donnees-utiles
    label: "The useful data is served and the disposable volumes are gone"
    tests:
      - test_le_volume_utile_est_servi_et_les_jetables_sont_retires
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/donnees-orphelines/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/volumes/
estimated_time: 60m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
