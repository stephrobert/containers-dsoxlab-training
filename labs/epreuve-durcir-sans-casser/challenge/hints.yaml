# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER INDICE POSE LA QUESTION QUI SAUVE L'ÉPREUVE : « est-ce que je
# retire un droit, ou est-ce que je retire une protection ? » Les deux
# exigences critiques sont déjà dans l'énoncé, donc les rappeler ne divulgue
# rien, et un apprenant qui prend un indice parce qu'il est bloqué ne doit pas y
# perdre l'épreuve entière sur la fausse correction la plus tentante du
# catalogue.
#
# LE TROISIÈME NOMME LE MÉCANISME QUI ÉVITE DE CASSER LE PARE-FEU : dans une
# chaîne, la première règle qui correspond décide, et `nft insert` place en tête
# là où `nft add` ajoute à la fin. Sans cela, l'apprenant ne voit pas d'autre
# issue que de supprimer la règle qui bloque.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-docs-durcir.py`) puis encodés : un indice écrit directement en base64
# ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont été
# livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
