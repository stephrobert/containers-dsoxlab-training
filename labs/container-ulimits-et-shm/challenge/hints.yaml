# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DONNE LES DEUX VALEURS PAR DÉFAUT. Ce sont les réponses des deux
# premières questions, et la seconde surprend : la donner priverait l'apprenant
# du seul moment du lab où il doute de sa propre mesure, ce qui est précisément
# ce qu'on veut qu'il vive. Le générateur vérifie qu'elles n'y figurent pas.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa première cause
# est la plus fréquente sur ce lab : l'apprenant a REFAIT sa mesure en croyant
# s'être trompé. L'indice le rassure sans lui donner la valeur.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-ulimits.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
