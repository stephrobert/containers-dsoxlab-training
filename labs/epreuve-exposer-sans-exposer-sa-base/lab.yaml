# Épreuve epreuve-exposer-sans-exposer-sa-base. Les champs marqués REQUIS sont exigés par le
# validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue sans
# un mot.
#
# `lab_type: challenge` et non `lab` : c'est ce qui autorise
# `exam_passing_score`, et ce qui dit à l'apprenant que cette épreuve ÉVALUE.
# Rien n'y est réexpliqué : les leçons du module l'ont enseigné, à savoir
# publier un port, le réseau par défaut face à un réseau à soi, les alias et
# l'isolement d'un conteneur.
id: epreuve-exposer-sans-exposer-sa-base                      # REQUIS
title: "Expose an application without exposing its database"
level: c3                     # REQUIS
description: "Publish the front end on the one interface asked for, make the database answer to a service name, put it on a network with no way out, leave no published port on it, and still get the business answer end to end."
skills:                       # REQUIS, non vide
  - docker
  - reseau
  - dns
  - exposition
  - diagnostic
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/epreuves/relier-deux-conteneurs/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  - test_l_inventaire_ne_publie_aucun_port
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: vitrine-locale
    label: "The storefront is reachable only from the machine itself"
    tests:
      - test_la_vitrine_ne_publie_que_sur_l_interface_demandee
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/publier-un-port/
  - id: base-sous-un-nom-de-service
    label: "The database answers to a service name distinct from its container name"
    tests:
      - test_la_base_repond_a_un_alias_distinct_de_son_nom
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/network/
  - id: base-inaccessible
    label: "The database cannot be reached from outside"
    tests:
      - test_la_base_est_sur_un_reseau_sans_issue
      - test_l_inventaire_ne_publie_aucun_port
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/reseau-interne/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/publier-un-port/
  - id: requete-metier
    label: "The business request still succeeds despite the isolation"
    tests:
      - test_la_requete_metier_aboutit_malgre_l_isolement
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/network/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/reseau-interne/
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
