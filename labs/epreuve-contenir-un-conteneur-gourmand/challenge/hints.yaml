# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un candidat n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UNE ÉPREUVE, et les indices y sont plus avares qu'ailleurs. Ils nomment
# des mécanismes et des commandes de lecture ; aucun n'écrit la correction.
#
# RÉÉCRITS LE 2026-11-04, et pas seulement pour les accents. L'indice 3, le plus
# cher après le quatrième, affirmait qu'un cgroup ne se pose qu'à la création du
# conteneur et que `docker update` ne l'applique pas. Mesuré sur Docker 29.9.2 :
# c'est faux, l'inspection et le cgroup portent tous deux la nouvelle valeur, et
# `StartedAt` ne change pas. L'indice orientait donc vers la recréation, qui est
# justement le piège de l'épreuve.
#
# L'indice 4 listait par ailleurs une erreur impossible : « déclencher la pointe
# et ne pas adresser de requête », alors que le contrôle pose le déclencheur puis
# interroge lui-même. Retirée.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session (`hints-gourmand.py`)
# puis encodés : un indice écrit directement en base64 ne se relit pas.
