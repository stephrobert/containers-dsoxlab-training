# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER INDICE PORTE L'AVERTISSEMENT SUR LE VOLUME, et c'est délibéré :
# l'exigence critique est déjà dans l'énoncé, donc la redire ne divulgue rien, et
# un apprenant qui prend un indice parce qu'il est bloqué ne doit pas y perdre
# l'épreuve entière. Le piège de ce lab se déclenche au moment où l'on croit bien
# faire, en recréant le conteneur pour y poser les limites.
#
# Le deuxième donne les commandes qui lisent les deux côtés, moteur et noyau. Le
# troisième nomme les mécanismes, dont le fait qui commande tout : un cgroup se
# pose à la création. Le quatrième nomme les CORRECTIONS INCOMPLÈTES, et la
# première qu'il cite est celle qui fait perdre les données.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-gourmand.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
