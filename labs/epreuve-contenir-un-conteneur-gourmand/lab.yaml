# Épreuve epreuve-contenir-un-conteneur-gourmand. Les champs marqués REQUIS sont exigés
# par le validator : sans eux, le lab est refusé, ou pire, disparaît du
# catalogue sans un mot.
#
# `lab_type: challenge` autorise `exam_passing_score` et dit à l'apprenant que
# cette épreuve ÉVALUE. Rien n'y est réexpliqué : les leçons du module l'ont
# enseigné, à savoir les cgroups, les limites, et la jointure entre le PID 1 d'un
# conteneur et son PID sur l'hôte.
id: epreuve-contenir-un-conteneur-gourmand                      # REQUIS
title: "The batch job that takes the host down with it"  # REQUIS
level: c6                     # REQUIS
description: "Contain a runaway batch job with memory, CPU and process limits, prove that the limit actually holds during a pointe, keep the service answering, and lose none of the earlier results."
skills:                       # REQUIS, non vide
  - docker
  - cgroups
  - limites
  - exploitation
  - internes
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/epreuves/contenir-un-conteneur-gourmand/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  - test_les_resultats_anterieurs_sont_intacts_et_aucun_n_est_tronque
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: limites-appliquees
    label: "Memory, CPU and process limits are set and actually enforced"
    tests:
      - test_les_trois_limites_sont_posees_et_appliquees
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/memoire-et-taches/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/brider-un-conteneur/
  - id: pointe-contenue
    label: "A spike is contained by the limit and the service keeps answering"
    tests:
      - test_la_pointe_est_contenue_par_la_limite
      - test_le_traitement_repond_encore_apres_la_pointe
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/memoire-et-taches/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/sous-le-capot/
  - id: resultats-conserves
    label: "Earlier results are intact and none is truncated"
    tests:
      - test_les_resultats_anterieurs_sont_intacts_et_aucun_n_est_tronque
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/volumes/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/cycle-de-vie-et-signaux/
  - id: processus-cote-hote
    label: "The report links the container to its host process and runtime"
    tests:
      - test_le_releve_dit_le_pid_hote_et_le_runtime
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/chaine-d-execution/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/sous-le-capot/
estimated_time: 45m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: false
  persistence_after_reboot: false
