services:
  ledger:
    image: python:3.14.10-slim-trixie@sha256:3cabfd7d7aaf394e6040e79fa1eec6ca1c52b74ed9188650472695d9a9326999
    entrypoint: ["/bin/sh", "/app/entry.sh"]
    environment: {SERVICE_MODE: standard}
    stop_grace_period: 8s
    labels:
      dsoxlab.lab: container-arret-transactionnel
    volumes:
      - .:/app:ro
      - ledger:/data
    ports:
      - "127.0.0.1::8080"
volumes:
  ledger:
    labels:
      dsoxlab.lab: container-arret-transactionnel
networks:
  default:
    labels:
      dsoxlab.lab: container-arret-transactionnel
