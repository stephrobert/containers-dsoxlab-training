# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DONNE LES NOMBRES, et c'est une décision, pas un oubli. Trois des
# quatre réponses sont stables d'un passage à l'autre : les écrire ici
# dispenserait du lab pour toujours, là où un indice doit coûter des points
# sans tuer l'exercice. Ils nomment donc les commandes et la méthode.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici les quatre
# causes réelles : les instructions comptées au lieu des couches, `comm` sur
# des listes non triées, les deux sens de `comm` inversés, et la révision
# cherchée dans l'historique où elle n'est pas.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-anatomie.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
