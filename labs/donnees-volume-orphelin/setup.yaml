---
- name: Prepare two uniquely labelled disposable volumes
  hosts: lab_target
  become: true
  vars:
    lab: donnees-volume-orphelin
    work: /opt/dsoxlab-donnees-volume-orphelin
    image: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  tasks:
    - name: Require the existing engine and refuse all reserved-name collisions
      ansible.builtin.shell: |
        set -eu
        docker info >/dev/null
        docker compose version >/dev/null 2>&1 || docker-compose version >/dev/null
        test ! -e "{{ work }}"
        test ! -L "{{ work }}"
        test -z "$(docker ps -aq --filter label=com.docker.compose.project=dsoxlab-{{ lab }})"
        test -z "$(docker volume ls -q --filter label=dsoxlab.lab={{ lab }})"
        ! docker volume inspect dsoxlab-{{ lab }}-data >/dev/null 2>&1
        ! docker volume inspect dsoxlab-{{ lab }}-stale >/dev/null 2>&1
      changed_when: false
    - name: Create the learner-owned workspace
      ansible.builtin.file:
        path: "{{ work }}"
        state: directory
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0750"
    - name: Record image ownership
      ansible.builtin.shell: |
        set -eu
        printf '%s\n' '{{ lab }}' > "{{ work }}/.owner"
        if ! docker image inspect "{{ image }}" >/dev/null 2>&1; then
          touch "{{ work }}/.image-owned"
          docker pull "{{ image }}" >/dev/null
        fi
      changed_when: true
    - name: Install the project
      ansible.builtin.copy:
        src: assets/
        dest: "{{ work }}/"
        owner: "{{ ansible_user | default('ansible') }}"
        mode: preserve
    - name: Generate an unpredictable pedagogic receipt
      ansible.builtin.copy:
        dest: "{{ work }}/expected.txt"
        content: "receipt={{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}\n"
        mode: "0444"
    - name: Create only volumes with both ownership labels
      ansible.builtin.command: >-
        docker volume create --label dsoxlab.lab={{ lab }}
        --label com.docker.compose.project=dsoxlab-{{ lab }}
        dsoxlab-{{ lab }}-{{ item }}
      loop: [data, stale]
      changed_when: true
    - name: Record the retained volume identity independently of its contents
      ansible.builtin.shell: |
        set -eu
        docker volume inspect -f '{% raw %}{{.CreatedAt}}{% endraw %}' dsoxlab-{{ lab }}-data > "{{ work }}/.volume-created"
        chmod 444 "{{ work }}/.volume-created"
      changed_when: true
    - name: Seed the retained data using a finite, automatically removed container
      ansible.builtin.command: >-
        docker run --rm --name dsoxlab-{{ lab }}-seed
        --label dsoxlab.lab={{ lab }} --label com.docker.compose.project=dsoxlab-{{ lab }}
        --network none --memory 32m --memory-swap 32m --pids-limit 16 --cpus 0.25
        -v {{ work }}/expected.txt:/expected.txt:ro
        -v dsoxlab-{{ lab }}-data:/data
        {{ image }} sh -c 'cp /expected.txt /data/receipt.txt; chmod 444 /data/receipt.txt'
      changed_when: true
    - name: Start the worker disconnected from its retained data
      ansible.builtin.shell: |
        set -eu
        cd "{{ work }}"
        if docker compose version >/dev/null 2>&1; then docker compose -p dsoxlab-{{ lab }} up -d; else docker-compose -p dsoxlab-{{ lab }} up -d; fi
      changed_when: true
    - name: Install the mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: "{{ work }}/MISSION.md"
        mode: "0644"
