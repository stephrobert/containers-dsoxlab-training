---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab compose-sante-et-dependances
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Docker et Compose
      ansible.builtin.apt:
        name: [docker.io, docker-compose]
        state: present
        update_cache: true
    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true
    - name: Créer les contextes
      ansible.builtin.file:
        path: "/opt/lab-compose-health/{{ item }}"
        state: directory
        mode: "0755"
      loop: [backend, app]
    - name: Déposer le backend lent
      ansible.builtin.copy:
        dest: /opt/lab-compose-health/backend/start.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          mkdir -p /www
          printf 'alive\n' > /www/live
          busybox-extras httpd -f -p 8080 -h /www &
          server=$!
          sleep "${START_DELAY:-4}"
          if test "${BLOCK_READY:-0}" = 0; then printf 'ready\n' > /www/ready; fi
          wait "$server"
    - name: Déposer le client sans reprise
      ansible.builtin.copy:
        dest: /opt/lab-compose-health/app/start.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          wget -T 2 -qO /tmp/observed http://backend:8080/ready
          test "$(cat /tmp/observed)" = ready
          exec sleep infinity
    - name: Déposer les Dockerfiles
      ansible.builtin.copy:
        dest: "/opt/lab-compose-health/{{ item }}/Dockerfile"
        mode: "0644"
        content: |
          FROM alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
          LABEL dsoxlab.lab="compose-sante-et-dependances"
          RUN apk add --no-cache busybox-extras
          COPY start.sh /usr/local/bin/start.sh
          CMD ["/usr/local/bin/start.sh"]
      loop: [backend, app]
    - name: Construire les images
      ansible.builtin.command:
        cmd: docker build -t dsoxlab-compose-health:{{ item }} /opt/lab-compose-health/{{ item }}
      loop: [backend, app]
      changed_when: true
    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
