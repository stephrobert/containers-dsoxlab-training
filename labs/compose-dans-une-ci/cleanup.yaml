---
- name: Remove only local CI lab resources
  hosts: lab_target
  become: true
  tasks:
    - name: Remove lab-labelled resources without pruning shared images
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            docker ps -aq --filter label=dsoxlab.lab=compose-dans-une-ci | xargs -r docker rm -f
            docker network ls -q --filter label=dsoxlab.lab=compose-dans-une-ci | xargs -r docker network rm
            docker volume ls -q --filter label=dsoxlab.lab=compose-dans-une-ci | xargs -r docker volume rm
            docker image ls -q --filter label=dsoxlab.lab=compose-dans-une-ci | sort -u | xargs -r docker image rm -f
            if test -f /opt/lab-compose-ci/base-cache.py; then
              /usr/bin/python3 /opt/lab-compose-ci/base-cache.py clean
            fi
          fi
      changed_when: false
    - name: Remove workspace
      ansible.builtin.file:
        path: /opt/lab-compose-ci
        state: absent
