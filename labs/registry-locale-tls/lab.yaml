# Lab registry-locale-tls. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: registry-locale-tls                      # REQUIS
title: "Serve a trusted registry and pull without disabling TLS checks"
level: c2                     # REQUIS
description: "Enable registry TLS, install its private CA for Docker, and prove that a real pull verifies the certificate without an insecure-registry exception."
skills:                       # REQUIS, non vide
  - docker
  - registry
  - tls
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/registres/distribution/#configurer-tls   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
