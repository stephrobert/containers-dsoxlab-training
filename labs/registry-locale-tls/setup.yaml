---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab registry-locale-tls
  hosts: lab_target
  become: true
  tasks:
    - name: Noter si le socle public etait deja present
      # UN LAB NE REND QUE CE QU'IL A POSE, et il rend tout ce qu'il a pose. Ce
      # lab TIRAIT le socle sans jamais le retirer : le validateur comptait
      # « image laisse », et le lab suivant heritait d'un moteur modifie. Le
      # marqueur dit au cleanup s'il doit rendre l'image, ou la laisser parce
      # qu'elle etait deja la.
      ansible.builtin.shell: |
        set -eu
        if docker image inspect 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1; then
          rm -f '/var/tmp/dsoxlab-registry-locale-tls.socle-a-rendre'
        else
          : > '/var/tmp/dsoxlab-registry-locale-tls.socle-a-rendre'
        fi
      changed_when: false

    - name: Installer les outils
      ansible.builtin.apt:
        name: [docker-ce, openssl, curl]
        state: present
        update_cache: true

    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true

    - name: Déclarer le nom local du registre
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} dsoxlab-registry-tls"
        block: "{{ ansible_default_ipv4.address }} registry-tls.lab.test"

    - name: Retirer le registre d'un passage précédent
      ansible.builtin.shell:
        cmd: |
          set -eu
          if docker container inspect dsoxlab-tls-registry >/dev/null 2>&1; then
            docker rm -f dsoxlab-tls-registry
          fi
      changed_when: false

    - name: Repartir sans ancien contexte ni ancienne confiance Docker
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-registry-tls
        - /etc/docker/certs.d/registry-tls.lab.test:15443

    - name: Créer les répertoires du lab
      ansible.builtin.file:
        path: "/opt/lab-registry-tls/{{ item }}"
        state: directory
        mode: "0755"
      loop: [certs, data, appli]

    - name: Générer une autorité et un certificat avec SAN
      ansible.builtin.shell:
        chdir: /opt/lab-registry-tls/certs
        cmd: |
          set -eu
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout ca.key -out ca.crt -subj '/CN=dsoxlab registry TLS CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes -keyout server.key \
            -out server.csr -subj '/CN=registry-tls.lab.test'
          printf '%s\n' 'subjectAltName=DNS:registry-tls.lab.test' \
            'extendedKeyUsage=serverAuth' 'basicConstraints=critical,CA:FALSE' > extensions.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -out server.crt -days 2 -extfile extensions.cnf
          chmod 644 ca.crt server.crt
      changed_when: true

    - name: Déposer la configuration HTTP initiale
      ansible.builtin.copy:
        dest: /opt/lab-registry-tls/config.yml
        mode: "0644"
        content: |
          version: 0.1
          storage:
            filesystem:
              rootdirectory: /var/lib/registry
          http:
            addr: :5000

    - name: Tirer les deux images épinglées
      ansible.builtin.command:
        cmd: docker pull {{ item }}
      loop:
        - registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
        - alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      register: pulls
      changed_when: "'Downloaded newer image' in pulls.stdout"

    - name: Démarrer le registre HTTP avec ses fichiers de configuration montés
      ansible.builtin.command:
        cmd: >-
          docker run -d --name dsoxlab-tls-registry -p 15443:5000
          -v /opt/lab-registry-tls/config.yml:/etc/distribution/config.yml:ro
          -v /opt/lab-registry-tls/certs:/certs:ro
          -v /opt/lab-registry-tls/data:/var/lib/registry
          registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
      changed_when: true

    - name: Attendre le registre HTTP
      ansible.builtin.uri:
        url: http://127.0.0.1:15443/v2/
      register: ready
      until: ready.status == 200
      retries: 15
      delay: 1

    - name: Tirer le produit du registre
      ansible.builtin.set_fact:
        release: "release-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters']) }}"

    - name: Déposer le produit à tirer
      ansible.builtin.copy:
        dest: /opt/lab-registry-tls/appli/release.txt
        content: "{{ release }}\n"
        mode: "0644"

    - name: Déposer son Dockerfile
      ansible.builtin.copy:
        dest: /opt/lab-registry-tls/appli/Dockerfile
        mode: "0644"
        content: |
          FROM alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          LABEL dsoxlab.lab="registry-locale-tls"
          COPY release.txt /release.txt
          CMD ["cat", "/release.txt"]

    - name: Construire et publier le produit sur la boucle locale
      ansible.builtin.shell:
        cmd: |
          set -eu
          docker build -t 127.0.0.1:15443/catalogue/appli:1.0 /opt/lab-registry-tls/appli
          docker push 127.0.0.1:15443/catalogue/appli:1.0
      changed_when: true

    - name: Relever l'image du produit
      ansible.builtin.command:
        cmd: docker image inspect 127.0.0.1:15443/catalogue/appli:1.0 --format '{% raw %}{{.Id}}{% endraw %}'
      register: image
      changed_when: false

    - name: Garder le relevé privé du banc
      ansible.builtin.copy:
        dest: /root/.lab-registry-tls.json
        content: "{{ {'image': image.stdout | trim, 'release': release} | to_json }}"
        mode: "0600"

    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
