# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB N'A PAS DE FORMULAIRE. Le générateur vérifie que les deux premiers
# indices ne nomment pas la construction attendue : comprendre qu'un outillage
# venu du socle ne se retire pas est tout l'exercice.
#
# LE PREMIER FAIT FAIRE LA MESURE QUI TRANCHE : supprimer l'outillage, peser,
# et constater que rien n'a changé. Puis il fait remonter à la cause, qui est
# que l'outillage appartient au point de départ.
#
# LE DEUXIÈME SÉPARE LES DEUX BESOINS, fabrication et exécution, et dit qu'un
# Dockerfile n'est pas limité à un seul point de départ. Il prévient aussi
# contre la copie trop large, qui est la faute suivante.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-multietapes.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
