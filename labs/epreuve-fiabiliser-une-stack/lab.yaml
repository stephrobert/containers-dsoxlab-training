# Épreuve epreuve-fiabiliser-une-stack. Les champs marqués REQUIS sont exigés par le
# validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue sans
# un mot.
#
# `lab_type: challenge` autorise `exam_passing_score` et dit à l'apprenant que
# cette épreuve ÉVALUE. Rien n'y est réexpliqué : les leçons du module l'ont
# enseigné, à savoir conditionner un démarrage à la santé d'un service, injecter
# un secret sans l'environnement, poser une limite, déclarer une politique de
# redémarrage, et superposer deux fichiers.
#
# ELLE NE DOUBLE PAS `epreuve-restaurer-une-stack`, qui mesure une restauration
# sur un SECOND hôte, sauvegarde comprise. Celle-ci reste sur un seul hôte et
# mesure quatre points de fiabilité.
id: epreuve-fiabiliser-une-stack                      # REQUIS
title: "The stack that only works on the second try"   # REQUIS
level: c4                     # REQUIS
description: "Make a Compose stack start correctly the first time: wait for the service it depends on, take the password out of the environment without losing it, apply a memory limit, keep a restart policy, and split deployment from development."
skills:                       # REQUIS, non vide
  - docker
  - compose
  - secrets
  - fiabilite
  - exploitation
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/epreuves/fiabiliser-une-stack/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  - test_le_mot_de_passe_n_est_ni_dans_l_environnement_ni_dans_l_image
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: demarrage-a-froid
    label: "The stack answers on the first try after a cold start"
    tests:
      - test_la_stack_repond_du_premier_coup_apres_un_demarrage_a_froid
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/sante-et-ordre-de-demarrage/
  - id: secret-sans-fuite
    label: "The password reaches the vault without sitting in the environment, the image or the resolved configuration"
    tests:
      - test_le_mot_de_passe_n_est_ni_dans_l_environnement_ni_dans_l_image
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/secrets/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/variables-et-environnements/
  - id: memoire-bornee
    label: "Every service carries an enforced memory limit"
    tests:
      - test_chaque_service_porte_une_limite_memoire_appliquee
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/ressources-et-redemarrage/
  - id: reprise-automatique
    label: "A service that dies comes back by itself"
    tests:
      - test_un_service_qui_meurt_repart_seul
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/ressources-et-redemarrage/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/execution-depannage/
  - id: variantes-distinctes
    label: "The development and deployment variants say different things"
    tests:
      - test_les_deux_variantes_disent_des_choses_differentes
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/variantes-de-deploiement/
estimated_time: 45m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
