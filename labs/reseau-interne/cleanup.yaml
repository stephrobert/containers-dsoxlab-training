---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# L'ORDRE COMPTE ICI, deux fois. Un réseau dont des conteneurs sont encore
# membres ne se supprime pas (« has active endpoints »), et une image dont des
# conteneurs dérivent non plus. Les conteneurs partent donc en premier, le
# réseau et l'image ensuite.
#
# LE RÉSEAU `confine` EST RETIRÉ même si c'est l'apprenant qui l'a créé : sans
# cela, deux contrôles sur quatre seraient vrais au passage suivant avant tout
# travail.
- name: Défaire le lab reseau-interne
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-isolation:1.0
    atelier: /opt/lab-isolation
    reseau_demande: confine
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-reseau-interne.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-reseau-interne.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les quatre conteneurs, AVANT le réseau et l'image
      ansible.builtin.shell:
        cmd: docker rm -f dehors coffre atelier-a atelier-b 2>/dev/null || true
      changed_when: false

    - name: Retirer le réseau du lab, maintenant qu'il n'a plus de membre
      ansible.builtin.shell:
        cmd: docker network rm {{ reseau_demande }} 2>/dev/null || true
      changed_when: false

    - name: Retirer l'image de service, puis l'image de base par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines et le cache de construction
      ansible.builtin.shell:
        cmd: docker image prune -f && docker builder prune -f || true
      changed_when: false

    - name: Retirer le répertoire de construction et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
