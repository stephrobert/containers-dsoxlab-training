# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER NE NOMME AUCUNE OPTION, et c'est une décision : il nomme la
# DISTINCTION entre les deux isolations, qui est tout le sujet du lab. Un
# apprenant qui a compris qu'il y en a deux trouve les options seul, et c'est
# exactement ce qu'on veut lui faire acquérir.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. La première cause
# citée est celle qui trompe le plus : l'atelier se parle, tout a l'air juste,
# et il sort encore parce que les conteneurs sont restés sur deux réseaux.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-interne.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
