services:
  worker:
    image: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    labels:
      dsoxlab.lab: secrets-au-runtime
    network_mode: none
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    cpus: 0.25
    cap_drop: [ALL]
    command: ["sh", "-c", "while :; do if test -r /run/secrets/token; then sha256sum /run/secrets/token | cut -d ' ' -f 1 > /run/result; fi; sleep 1; done"]
