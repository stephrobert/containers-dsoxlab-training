services:
  worker:
    image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    labels:
      dsoxlab.lab: secrets-au-runtime
    network_mode: none
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    cpus: 0.25
    cap_drop: [ALL]
    command: ["sh", "-c", "while :; do if test -r /run/secrets/token; then sha256sum /run/secrets/token | cut -d ' ' -f 1 > /run/result; fi; sleep 1; done"]
