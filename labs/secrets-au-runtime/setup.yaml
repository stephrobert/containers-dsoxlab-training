---
- name: Prepare a random, local-only pedagogic runtime secret
  hosts: lab_target
  become: true
  vars:
    lab: secrets-au-runtime
    work: /opt/dsoxlab-secrets-au-runtime
    image: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  tasks:
    - name: Require the existing engine and refuse collisions
      ansible.builtin.shell: |
        set -eu
        docker info >/dev/null
        command -v python3 >/dev/null
        docker compose version >/dev/null 2>&1 || docker-compose version >/dev/null
        test ! -e "{{ work }}"
        test ! -L "{{ work }}"
        test -z "$(docker ps -aq --filter label=com.docker.compose.project=dsoxlab-{{ lab }})"
      changed_when: false
    - name: Create the learner-owned workspace
      ansible.builtin.file:
        path: "{{ work }}"
        state: directory
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0750"
    - name: Record image ownership
      ansible.builtin.shell: |
        set -eu
        printf '%s\n' '{{ lab }}' > "{{ work }}/.owner"
        if ! docker image inspect "{{ image }}" >/dev/null 2>&1; then
          touch "{{ work }}/.image-owned"
          docker pull "{{ image }}" >/dev/null
        fi
      changed_when: true
    - name: Install the project without any secret in its configuration
      ansible.builtin.copy:
        src: assets/
        dest: "{{ work }}/"
        owner: "{{ ansible_user | default('ansible') }}"
        mode: preserve
    - name: Create the private source directory
      ansible.builtin.file:
        path: "{{ work }}/secrets"
        state: directory
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0700"
    - name: Generate the disposable pedagogic token without logging its value
      ansible.builtin.copy:
        dest: "{{ work }}/secrets/token"
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}\n"
        owner: root
        mode: "0600"
      no_log: true
    - name: Start the service with the secret deliberately missing
      ansible.builtin.shell: |
        set -eu
        cd "{{ work }}"
        if docker compose version >/dev/null 2>&1; then docker compose -p dsoxlab-{{ lab }} up -d; else docker-compose -p dsoxlab-{{ lab }} up -d; fi
      changed_when: true
    - name: Install the mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: "{{ work }}/MISSION.md"
        mode: "0644"
