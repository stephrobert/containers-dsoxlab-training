---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab buildkit-secret-de-build
  hosts: lab_target
  become: true
  tasks:
    - name: Vérifier si le service existe
      ansible.builtin.stat:
        path: /etc/systemd/system/dsoxlab-buildkit-secret.service
      register: depot_service

    - name: Arrêter et désactiver le dépôt privé
      ansible.builtin.systemd_service:
        name: dsoxlab-buildkit-secret
        state: stopped
        enabled: false
      when: depot_service.stat.exists

    - name: Retirer les constructeurs et images du lab
      ansible.builtin.shell:
        cmd: |
          set -eu
          if command -v docker >/dev/null 2>&1; then
            for builder in dsoxlab-secret-work dsoxlab-secret-test; do
              if docker buildx inspect "$builder" >/dev/null 2>&1; then
                docker buildx rm -f "$builder"
              fi
            done
            for image in dsoxlab-secret:finale dsoxlab-secret:test; do
              if docker image inspect "$image" >/dev/null 2>&1; then
                docker image rm -f "$image"
              fi
            done
            images=$(docker image ls -aq --filter label=dsoxlab.lab=buildkit-secret-de-build)
            if test -n "$images"; then docker image rm -f $images; fi
          fi
      changed_when: false

    # L'IMAGE DU CONSTRUCTEUR N'EST PAS RETIRÉE, et c'est délibéré.
    #
    # Ce cleanup la retirait, pour une raison qui était une erreur de
    # raisonnement : le cycle de validation la comptait comme laissée. La
    # correction avait donc été appliquée à la plainte de la mesure, et non au
    # fait. `docker buildx create` tire `moby/buildkit:buildx-stable-1`
    # implicitement : c'est le moteur de construction, elle n'est le livrable
    # d'aucun lab, elle sert tous les `buildx` suivants de la machine, et la
    # retirer coûte 249 Mo de retéléchargement à l'apprenant, pour un objet
    # qu'il n'a pas demandé.
    #
    # Pire, le lab retirait ainsi une image qu'il n'avait pas créée quand elle
    # préexistait. Mesuré le 2026-11-02 : joué seul sur une machine portant
    # déjà un constructeur, il sortait ROUGE sur « image préexistante
    # supprimée ». Le validateur l'exempte désormais, et le cleanup ne retire
    # plus que le CONTENEUR du constructeur, qui est bien à lui.

    - name: Retirer seulement les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-buildkit-secret
        - /usr/local/lib/lab-buildkit-secret
        - /root/.lab-buildkit-secret.json
        - /etc/systemd/system/dsoxlab-buildkit-secret.service
        - /opt/MISSION.md

    - name: Recharger systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
