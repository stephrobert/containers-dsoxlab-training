# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DONNE LES VALEURS, et pour ce lab c'est en partie impossible : les
# adresses dépendent de la machine et le jeton est tiré au hasard. Ils nomment
# donc les commandes, et surtout la distinction que le lab fait acquérir, entre
# l'inspection d'un conteneur et celle d'un réseau.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici les cinq
# causes réelles : le nom passé à `nc` au lieu de l'adresse, la passerelle
# cherchée dans le conteneur, `docker0` répondu sans vérifier, le jeton déposé
# sur l'hôte au lieu du conteneur, et un jeton périmé.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-bridge-defaut.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
