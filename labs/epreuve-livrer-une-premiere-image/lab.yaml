# Épreuve epreuve-livrer-une-premiere-image. Les champs marqués REQUIS sont exigés par le
# validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue sans
# un mot.
#
# `lab_type: challenge` autorise `exam_passing_score` et dit à l'apprenant que
# cette épreuve ÉVALUE. Rien n'y est réexpliqué : les leçons du module l'ont
# enseigné, à savoir écrire un Dockerfile, choisir son contexte de build,
# déclarer un utilisateur, et pousser dans un registre.
#
# ELLE NE DOUBLE PAS `epreuve-livrer-une-image`, qui clôt un module plus tardif :
# celle-là mesure une livraison vers un client nu, sur deux machines, avec un
# compte en lecture seule. Celle-ci mesure la PREMIÈRE livraison, sur une seule
# machine. Les deux partagent une exigence, le secret absent des couches, et
# c'est délibéré : c'est la faute la plus coûteuse du métier, et elle se mesure
# à chaque fois qu'on construit.
id: epreuve-livrer-une-premiere-image                      # REQUIS
title: "Deliver a first image worth publishing"        # REQUIS
level: c2                     # REQUIS
description: "Write the Dockerfile for a provided application: it must answer with no identity option, run under a numeric non-zero UID that owns its data, leave credentials and work files out of every layer, stay under a measured size threshold, and be published by digest."
skills:                       # REQUIS, non vide
  - docker
  - images
  - dockerfile
  - registre
  - securite
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/epreuves/livrer-une-premiere-image/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  # LE JETON SEUL. Un secret publie est irreversible, et c'est le
  # defaut que cette epreuve existe pour eliminer. Livrer son
  # repertoire de travail est du gaspillage, pas une breche : cela se
  # note par son propre controle, et cela se compense.
  - test_le_jeton_ne_survit_dans_aucune_couche
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: image-non-privilegiee
    label: "The image runs as is, under a non-root identity that owns its data"
    tests:
      - test_l_image_repond_sans_option_d_identite
      - test_l_image_tourne_sous_un_uid_non_nul_proprietaire_de_ses_donnees
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/utilisateur-et-permissions/
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/ecrire-dockerfile/
  - id: jeton-hors-des-couches
    label: "The repository token is in no layer of the image"
    tests:
      - test_le_jeton_ne_survit_dans_aucune_couche
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/ecrire-dockerfile/
  - id: image-sobre
    label: "The image ships only what the application needs"
    tests:
      - test_le_repertoire_de_travail_n_est_pas_livre
      - test_la_taille_ajoutee_a_la_base_reste_sous_le_seuil
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/ecrire-dockerfile/
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/choisir-une-image-de-base/
  - id: publication-identifiee
    label: "The image is published and its recorded digest is the one the registry serves"
    tests:
      - test_l_image_est_publiee_et_son_digest_consigne_est_celui_servi
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/registres/docker-hub/
estimated_time: 45m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
