# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UNE ÉPREUVE DE CONSTRUCTION, et le dosage n'est donc pas celui d'une
# épreuve de diagnostic : il n'y a pas de cause cachée à trouver, il y a un
# Dockerfile à écrire. Les indices ne retiennent donc pas une cause, ils
# retiennent la RÉPONSE.
#
# Le premier donne la méthode, qui est de décider pièce par pièce ce qu'une
# image doit contenir. Le deuxième donne les commandes qui MESURENT ce que les
# contrôles mesurent : un apprenant qui les connaît se vérifie lui-même avant de
# rendre, et c'est une compétence du métier, pas une faveur. Le troisième nomme
# les mécanismes. Le quatrième nomme les LIVRAISONS INCOMPLÈTES, et celle qui
# compte ici est le secret effacé par une commande : il passe le regard et
# échoue sur l'archive.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-premiere-livraison.py`) puis encodés : un indice écrit
# directement en base64 ne se relit pas, et c'est ainsi que deux labs d'un
# catalogue frère ont été livrés avec les indices du générateur.
hints:
