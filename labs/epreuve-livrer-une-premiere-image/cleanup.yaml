---
# Joué par `dsoxlab clean`, et ce qu'il retire est exactement ce que le setup a
# posé, plus ce que l'apprenant a construit en suivant l'énoncé.
#
# L'ORDRE N'EST PAS LIBRE : les conteneurs d'abord, les images ensuite. Une
# image dont un conteneur descend ne se retire pas, et deux labs de ce catalogue
# avaient été ROUGE sur cette seule inversion.
#
# LES IMAGES DE L'APPRENANT SONT RETIRÉES ELLES AUSSI, et c'est voulu : l'énoncé
# nomme le tag à produire et le registre où le pousser, donc le lab sait
# exactement ce qu'il a fait naître. Les laisser ferait échouer la photographie
# du lab suivant.
- name: Retirer seulement les ressources de l'épreuve de première livraison
  hosts: lab_target
  become: true
  vars:
    depot: /opt/lab-premiere-livraison
    etat: /root/.lab-premiere-livraison-state.json
    tag_attendu: premiere-livraison:1.0
    port_registre: 5000
  tasks:
    - name: Retirer les conteneurs du lab, le registre et ses volumes compris
      # LE `-v` N'EST PAS DÉCORATIF, et son absence a fait sortir ce lab ROUGE à
      # sa première mesure. L'image `registry:3.1.2` déclare
      # `VOLUME /var/lib/registry` : chaque conteneur de registre crée donc un
      # volume ANONYME, et `docker rm -f` sans `-v` le laisse derrière lui. Deux
      # passages du cycle de validation avaient laissé deux volumes orphelins.
      #
      # `-v` ne retire que les volumes anonymes DU conteneur retiré : il ne
      # touche jamais un volume nommé, donc jamais le travail de quelqu'un
      # d'autre.
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          ids=$(docker ps -aq --filter label=dsoxlab.lab=epreuve-livrer-une-premiere-image)
          if test -n "$ids"; then docker rm -f -v $ids; fi
      changed_when: false

    - name: Retirer les images que l'énoncé fait produire
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          for ref in '{{ tag_attendu }}' \
                     '127.0.0.1:{{ port_registre }}/{{ tag_attendu }}' \
                     'reference-livraison:mesure'; do
            docker image rm -f "$ref" >/dev/null 2>&1 || true
          done
      changed_when: false

    - name: Rendre les socles publics, et seulement ceux que ce lab a tirés
      # Deux socles, deux marqueurs : voir la tâche jumelle du setup.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        base='/var/tmp/dsoxlab-epreuve-livrer-une-premiere-image.socle-'
        if test -e "${base}alpine"; then
          docker image rm -f 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f "${base}alpine"
        fi
        if test -e "${base}registre"; then
          docker image rm -f 'registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3' >/dev/null 2>&1 || true
          rm -f "${base}registre"
        fi
      changed_when: false

    - name: Retirer seulement les fichiers préparés
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ depot }}"
        - "{{ etat }}"
        - /root/reference.Dockerfile
