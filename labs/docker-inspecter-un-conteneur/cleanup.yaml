---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# CE QU'IL DOIT IMPÉRATIVEMENT RETIRER : le répertoire de travail entier. Les
# réponses de l'apprenant y sont, et la trace qu'il a sortie du conteneur
# aussi. Les laisser derrière rendrait le prochain passage déjà résolu pour
# trois contrôles sur quatre, et le lab se noterait sur un travail ancien.
#
# POURQUOI LES VALEURS N'ONT PAS BESOIN D'ÊTRE EFFACÉES. Elles n'existent que
# dans le conteneur et dans ce que le moteur en montre : le retirer les emporte.
# C'est la contrepartie du choix du setup, qui n'écrit aucune réponse nulle part.
- name: Défaire le lab docker-inspecter-un-conteneur
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-inspection:1.0
    atelier: /opt/lab-inspection
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-docker-inspecter-un-conteneur.socle-a-rendre'; then
          docker image rm -f 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-docker-inspecter-un-conteneur.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer le conteneur, qu'il tourne encore ou non
      ansible.builtin.shell:
        cmd: docker rm -f greffier 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de travail, les réponses et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
