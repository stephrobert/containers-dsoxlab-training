# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite, et aucun ne donne la réponse : il n'y en a pas à donner, puisque
# les quatre valeurs sont tirées au hasard à chaque passage. Ces indices
# nomment donc les COMMANDES, ce qui est exactement le sujet du lab.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici les trois
# causes réelles, dans l'ordre où elles se produisent : le port du conteneur
# répondu à la place de celui de l'hôte, une valeur relevée avant un `reset`,
# et le conteneur arrêté pour être fouillé.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-inspecter.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
