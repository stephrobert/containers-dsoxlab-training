title: "Interroger un conteneur en marche"
description: "Obtenir d'un conteneur en marche ce qu'aucun fichier de l'hôte ne dit : un jeton dans ses journaux, l'adresse que le moteur lui a donnée, le port qu'il publie, et un fichier qu'il a écrit après son démarrage."
