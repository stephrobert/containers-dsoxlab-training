id: docker-contexte-ssh
title: "Create an SSH Docker context"
level: c6
description: "A named Docker context drives the engine of a second VM, and the default context stays selected."
skills:
  - docker
  - context
  - ssh
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/daemon-config/#mettre-en-pratique
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
      roles:
        remote: docker-client.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
