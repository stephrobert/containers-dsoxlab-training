# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DIT CE QUE VAUT `memory.max` SANS LIMITE. C'est la réponse de la
# troisième question, la seule de ce lab qui s'apprenne par cœur, et la seule
# qui surprenne. Les indices disent OÙ regarder, jusqu'au chemin exact, et le
# générateur vérifie que la valeur n'y figure pas.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici la plus
# fréquente est d'avoir converti la limite, en réécrivant `256m` ou en divisant
# par 1024, alors que la question demande le contenu du fichier tel quel.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-cgroups.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
