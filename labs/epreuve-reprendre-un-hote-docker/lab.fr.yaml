# Surcharge française de l'épreuve epreuve-reprendre-un-hote-docker. Elle ne porte QUE
# `title` et `description` : tout autre champ y est ignoré en silence, parce que
# le contrat ne se traduit pas.
title: "Reprendre un hôte Docker que personne n'a suivi"
description: "Reprendre un hôte Docker laissé sans suivi : imposer une rotation des journaux et redémarrer le démon, rendre la place occupée pour rien sans perdre le volume de l'application, trancher qui peut encore parler au moteur, poser un proxy de lecture seule devant le socket, et fermer l'API TCP."
