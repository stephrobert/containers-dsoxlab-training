id: image-scan-de-vulnerabilites
title: "Gate an image using dated, real offline vulnerability scans"
level: c6
description: "A gate refuses an image affected by a precise CVE, based on a dated offline scan."
skills: [image-scanning, vulnerability-policy, evidence, supply-chain]
distros: [debian13]
doc_url: https://www.stephane-robert.info/docs/conteneurisation/supply-chain-images/#mettre-en-pratique
lab_type: lab
estimated_time: 45m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
