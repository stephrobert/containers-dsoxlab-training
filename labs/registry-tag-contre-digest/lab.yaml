# Lab registry-tag-contre-digest. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: registry-tag-contre-digest                      # REQUIS
title: "Recover the original release after its tag has moved"
level: c2                     # REQUIS
description: "Distinguish a mutable tag from an image digest, recover the original release from the registry, and run it under its immutable reference."
skills:                       # REQUIS, non vide
  - docker
  - registry
  - image-digest
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/registres/#tags-vs-digests--la-distinction-critique   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
