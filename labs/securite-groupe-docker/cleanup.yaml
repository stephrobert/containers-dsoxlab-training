---
- name: Clean lab securite-groupe-docker
  hosts: lab_target
  become: true
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-securite-groupe-docker.socle-a-rendre'; then
          docker image rm -f 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-securite-groupe-docker.socle-a-rendre'
        fi
      changed_when: false

    - name: Check whether setup created the synthetic audit account
      ansible.builtin.stat:
        path: /opt/dsoxlab-securite-groupe-docker/account-created
      register: audit_account_marker
    - name: Remove only the synthetic audit account created by setup
      ansible.builtin.user:
        name: dsoxlab-auditor
        state: absent
        remove: true
      when: audit_account_marker.stat.exists
    - name: Remove only containers carrying this lab's label
      ansible.builtin.shell: |
        set -eu
        ids="$(docker ps -aq --filter label=dsoxlab.lab=securite-groupe-docker)"
        if [ -n "$ids" ]; then docker rm -f $ids; fi
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false
    - name: Remove only volumes carrying this lab's label
      ansible.builtin.shell: |
        set -eu
        ids="$(docker volume ls -q --filter label=dsoxlab.lab=securite-groupe-docker)"
        if [ -n "$ids" ]; then docker volume rm $ids; fi
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false
    - name: Remove the unique work directory created for this lab
      ansible.builtin.file:
        path: /opt/dsoxlab-securite-groupe-docker
        state: absent
