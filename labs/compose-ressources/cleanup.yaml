---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab compose-ressources
  hosts: lab_target
  become: true
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-compose-ressources.socle-a-rendre'; then
          docker image rm -f 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-compose-ressources.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les ressources propres au projet
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          containers=$(docker ps -aq --filter label=com.docker.compose.project=dsoxlab-ressources)
          if test -n "$containers"; then docker rm -f $containers; fi
          networks=$(docker network ls -q --filter label=com.docker.compose.project=dsoxlab-ressources)
          if test -n "$networks"; then docker network rm $networks; fi
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=dsoxlab-ressources)
          if test -n "$volumes"; then docker volume rm $volumes; fi
      changed_when: false
    - name: Retirer les fichiers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/opt/lab-compose-resources, /opt/MISSION.md]
