# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# DEUX DES TROIS RÉPONSES SONT TIRÉES AU HASARD par le setup à chaque passage,
# donc indonnables par construction. LA TROISIÈME NE L'EST PAS, et le générateur
# vérifie qu'aucun indice ne nomme l'une des deux politiques possibles : les
# citer, même pour les opposer, donnerait une réponse qui se tire à pile ou face.
#
# LE PREMIER NE DONNE AUCUNE COMMANDE : il demande de lire les traces, puis de
# se demander pourquoi deux conteneurs au même défaut ne se comportent pas
# pareil. C'est le raisonnement du lab, et il vaut plus que n'importe quelle
# commande.
#
# LE DEUXIÈME DIT OÙ LIRE CHAQUE VALEUR, et sur quel conteneur : une valeur de
# diagnostic ne se lit pas sur l'objet que la réparation modifie, et le lab y
# serait pris sans cela.
#
# LE TROISIÈME DIT QUE LE MOTEUR RATTRAPE SEUL, et combien de temps il y met.
# Laisser attendre sans le dire ferait conclure à l'échec d'une réparation
# correcte, et enseignerait de recréer au lieu de corriger.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa première cause
# est le cœur du lab : avoir retiré la politique, c'est-à-dire avoir fait taire
# la boucle sans rien régler.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-boucle.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
