# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB DEMANDE DES GESTES, pas des valeurs : les indices dosent la nomination
# de la syntaxe de publication. Le premier ne dit même pas que `-p` prend une
# adresse, il dit qu'il prend « plus de parties » : c'est ce qui laisse à
# l'apprenant la découverte, qui est tout le sujet.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici la première
# cause citée est le piège du sujet lui-même, vérifié sur la machine : un port
# publié accepte les connexions avant que quoi que ce soit n'écoute, donc un
# `nc -z` réussi ne prouve rien.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-publication.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
