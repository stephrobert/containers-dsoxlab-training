---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# CE QU'IL DOIT IMPÉRATIVEMENT RETIRER : les trois conteneurs, quelle que soit
# la façon dont l'apprenant les a recréés. Ce lab fait justement détruire et
# recréer : les conteneurs présents à la fin ne sont pas ceux que le setup a
# lancés, mais ils portent les mêmes noms, et c'est par les noms qu'on les
# retire.
#
# L'IMAGE DE SERVICE PART AUSSI. Elle est construite par le setup, et un
# `docker rmi` sur un tag dont des conteneurs dérivent échouerait : d'où les
# conteneurs d'abord, l'image ensuite.
- name: Défaire le lab reseau-publication-de-ports
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-publication:1.0
    atelier: /opt/lab-publication
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-reseau-publication-de-ports.socle-a-rendre'; then
          docker image rm -f 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-reseau-publication-de-ports.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les trois conteneurs, AVANT l'image dont ils dérivent
      ansible.builtin.shell:
        cmd: docker rm -f vitrine annexe interne 2>/dev/null || true
      changed_when: false

    - name: Retirer l'image de service, puis l'image de base par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines et le cache de construction
      ansible.builtin.shell:
        cmd: docker image prune -f && docker builder prune -f || true
      changed_when: false

    - name: Retirer le répertoire de construction et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
