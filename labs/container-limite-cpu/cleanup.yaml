---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# RETIRER LES CONTENEURS SUFFIT, et c'est le compteur d'étranglements qui le
# rend indispensable : il vit dans le cgroup, et le cgroup part avec le
# conteneur. S'il survivait, le quatrième contrôle serait vrai au passage
# suivant avant tout travail, puisque la limite aurait déjà mordu.
#
# `epingle` EST RETIRÉ ALORS QUE LE SETUP NE LE CRÉE PAS : c'est l'apprenant qui
# le lance.
#
# LES BOUCLES DE CHARGE partent avec leur conteneur : un `docker rm -f` tue tous
# ses processus, et il n'y a donc rien à arrêter d'abord.
- name: Défaire le lab container-limite-cpu
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-cpu:1.0
    atelier: /opt/lab-cpu
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-container-limite-cpu.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-container-limite-cpu.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les deux conteneurs, et avec eux leurs cgroups
      ansible.builtin.shell:
        cmd: docker rm -f brideur epingle 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de travail, les réponses et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
