# Lab container-limite-cpu. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: container-limite-cpu                      # REQUIS
title: "Capping a processor, and proving it"            # REQUIS
level: c1                     # REQUIS
description: "Read the quota a cgroup declares, see that a time limit changes nothing in what the container believes it has, use the other mechanism that does change it, and prove through the throttling counter that the limit has bitten."
skills:                       # REQUIS, non vide
  - docker
  - cgroups
  - cpu
  - limites
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/sous-le-capot/#cgroups--limiter-ce-que-le-conteneur-utilise   # REQUIS, http(s)
lab_type: lab
estimated_time: 35m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
