# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DIT COMBIEN DE CPU LE CONTENEUR VOIT. C'est la réponse de la deuxième
# question, le piège du sujet, et la seule chose de ce lab qui compte vraiment.
# Le générateur vérifie que la valeur n'y figure pas.
#
# Le premier indice dit en revanche que cette question ne se répond PAS dans le
# cgroup : c'est la seule aide qui compte, puisque l'erreur naturelle est d'y
# chercher une réponse qui n'y est pas.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa première cause
# est la plus fréquente sur ce lab, et elle est inhabituelle : l'apprenant a
# REFUSÉ sa propre mesure parce qu'elle lui paraissait absurde.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-cpu.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
