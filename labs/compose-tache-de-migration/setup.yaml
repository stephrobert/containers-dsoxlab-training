---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab compose-tache-de-migration
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Docker et Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-compose-plugin]
        state: present
        update_cache: true
    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true
    - name: Créer le contexte
      ansible.builtin.file:
        path: /opt/lab-compose-migrate
        state: directory
        # IL APPARTIENT À L'APPRENANT. Sans `owner`, ce répertoire était
        # `root:root` en 0755, et l'apprenant devait passer par `sudo` pour y
        # écrire son `compose.yaml`, c'est-à-dire pour rendre son travail. Le
        # lab mesure Compose, pas la permission d'écrire un fichier, et les
        # labs voisins posent déjà cet `owner`.
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0755"
    - name: Déposer la migration transactionnelle
      ansible.builtin.copy:
        dest: /opt/lab-compose-migrate/migrate.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          mkdir -p /data
          sqlite3 /data/app.db <<'SQL'
          BEGIN;
          CREATE TABLE IF NOT EXISTS migrations(version INTEGER PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS records(id INTEGER PRIMARY KEY, value TEXT NOT NULL);
          INSERT OR IGNORE INTO migrations VALUES(1);
          COMMIT;
          SQL
    - name: Déposer le démarrage applicatif
      ansible.builtin.copy:
        dest: /opt/lab-compose-migrate/app.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          test "$(sqlite3 /data/app.db 'SELECT count(*) FROM migrations WHERE version=1;')" = 1
          sqlite3 /data/app.db 'SELECT count(*) FROM records;' > /tmp/ready
          exec sleep infinity
    - name: Déposer le Dockerfile
      ansible.builtin.copy:
        dest: /opt/lab-compose-migrate/Dockerfile
        mode: "0644"
        content: |
          FROM alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          LABEL dsoxlab.lab="compose-tache-de-migration"
          RUN apk add --no-cache sqlite
          COPY migrate.sh app.sh /usr/local/bin/
          CMD ["/usr/local/bin/app.sh"]
    - name: Construire l'image
      ansible.builtin.command:
        cmd: docker build -t dsoxlab-compose-migrate:app /opt/lab-compose-migrate
      changed_when: true
    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
