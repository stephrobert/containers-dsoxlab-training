# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE NOMME LES DEUX COUPABLES NI LE STATUT. Ce sont les trois réponses, et
# elles se diagnostiquent. Le générateur vérifie qu'elles n'y figurent pas.
#
# LE PREMIER NE DONNE AUCUNE COMMANDE : il demande de comparer les deux messages
# mot à mot, et de se demander QUI PARLE dans chacun. C'est le raisonnement du
# lab, et il vaut plus que n'importe quelle commande.
#
# LE TROISIÈME DIT FRANCHEMENT QUE DOCKER NE MONTRE PAS le second coupable.
# Laisser chercher dans un outil aveugle n'enseigne rien, cela use, et
# l'apprenant qui s'y acharne apprendrait que le dépannage est une affaire de
# chance.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa première cause
# est le cœur du lab : avoir libéré les ports, c'est-à-dire avoir coupé ce qui
# marchait.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-conflit-port.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
