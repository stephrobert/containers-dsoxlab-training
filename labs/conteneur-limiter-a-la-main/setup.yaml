---
# Joué par `dsoxlab run` : pose la situation du lab conteneur-limiter-a-la-main
# sur oci.lab, une Debian 13 SANS Docker (niveau 1, rôle sans-docker).
#
# CE QUE CE SETUP POSE. Un rootfs Alpine 3.24.2 extrait de l'archive vérifiée
# dans /srv/quai, avec /dev/null et /dev/zero : fabriquer le rootfs était le
# lab précédent, ce lab porte sur les limites.
#
# CE QU'IL NE POSE PAS. Le cgroup /sys/fs/cgroup/quai et le conteneur : c'est
# le travail. Un passage précédent est d'abord défait, cgroup compris. Un
# cgroup se retire seulement vide, d'où cgroup.kill avant rmdir ; et rmdir
# remet ses compteurs (dont oom_kill) à zéro.
- name: Préparer le lab conteneur-limiter-a-la-main
  hosts: lab_target
  become: true
  vars:
    archive: alpine-minirootfs-3.24.2-x86_64.tar.gz
    url: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.2-x86_64.tar.gz
    somme: c5ca053cfe1d85c5b96dff8b9bc57045f7f184a30ffb6b65776409ca90388677
  tasks:
    - name: Refuser un hôte où Docker est installé
      ansible.builtin.shell: "! command -v docker"
      changed_when: false

    - name: Faire transmettre cpu, memory et pids par la racine des cgroups
      # Sans eux, le cgroup quai n'aurait pas les fichiers de réglage demandés
      # (cpu.max manquerait), et l'apprenant chercherait la faute dans son
      # propre travail. L'état de départ varie : sur oci.lab, systemd avait
      # activé cpu (DefaultCPUAccounting=yes), alors que la VM du site, montée
      # par dsoxlab 0.11.0, ne transmettait que memory et pids (relevé du
      # 2026-11-24). Le setup active ce qui manque et note ce qu'il a activé,
      # pour que le cleanup le rende.
      ansible.builtin.shell: |
        set -eu
        test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
        marque=/var/tmp/dsoxlab-conteneur-limiter-a-la-main.controleurs-a-rendre
        for c in cpu memory pids; do
          if ! grep -qw "$c" /sys/fs/cgroup/cgroup.subtree_control; then
            echo "+$c" > /sys/fs/cgroup/cgroup.subtree_control
            echo "$c" >> "$marque"
            echo "active : $c"
          fi
        done
        for c in cpu memory pids; do
          grep -qw "$c" /sys/fs/cgroup/cgroup.subtree_control
        done
      register: controleurs
      changed_when: "'active' in controleurs.stdout"

    - name: Défaire un passage précédent
      ansible.builtin.shell: |
        set -eu
        for p in $(ls /proc | grep -E '^[0-9]+$'); do
          if [ "$(readlink /proc/$p/root 2>/dev/null)" = /srv/quai ]; then kill -KILL "$p" 2>/dev/null || true; fi
        done
        if [ -d /sys/fs/cgroup/quai ]; then
          echo 1 > /sys/fs/cgroup/quai/cgroup.kill
          sleep 1
          rmdir /sys/fs/cgroup/quai
        fi
        findmnt -rn -o TARGET | grep '^/srv/quai' | sort -r | xargs -r umount -l || true
        rm -rf /srv/quai
      changed_when: true

    - name: Télécharger l'archive officielle, vérifiée
      ansible.builtin.get_url:
        url: "{{ url }}"
        dest: "/var/tmp/{{ archive }}"
        checksum: "sha256:{{ somme }}"
        mode: "0644"

    - name: Extraire le rootfs dans /srv/quai
      ansible.builtin.shell: |
        set -eu
        mkdir -p /srv/quai
        tar -xzf "/var/tmp/{{ archive }}" -C /srv/quai
        mknod -m 666 /srv/quai/dev/null c 1 3
        mknod -m 666 /srv/quai/dev/zero c 1 5
        rm -f "/var/tmp/{{ archive }}"
      changed_when: true

    - name: Déposer la mission
      ansible.builtin.copy:
        src: "challenge/README{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
