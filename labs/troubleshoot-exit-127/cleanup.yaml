---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# LES QUATRE CONTENEURS PARTENT, dont `repare` que le setup ne crée pas : c'est
# l'apprenant qui le lance, et le laisser derrière rendrait le quatrième
# contrôle vrai au passage suivant avant tout travail.
#
# LES TROIS PANNES SONT DES CONTENEURS ARRÊTÉS, et il faut les retirer malgré
# cela : un conteneur arrêté garde son code de sortie, et c'est précisément ce
# que les trois premiers contrôles lisent. Les laisser ne casserait rien, mais
# le prochain `run` échouerait sur des noms déjà pris.
- name: Défaire le lab troubleshoot-exit-127
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    tag_local: lab-exit:1.0
    atelier: /opt/lab-exit
  tasks:
    - name: Retirer les trois pannes et le conteneur réparé
      ansible.builtin.shell:
        cmd: docker rm -f panne-a panne-b panne-c repare 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} {{ image_epinglee }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de travail, les réponses et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
