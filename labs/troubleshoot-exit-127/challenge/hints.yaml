# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DONNE LES CODES NI LE STATUT. Ce sont les trois réponses, et elles se
# LISENT : un lab de dépannage dont les indices donnent le diagnostic n'enseigne
# plus à diagnostiquer. Le générateur vérifie qu'aucune des trois valeurs n'y
# figure.
#
# LE TROISIÈME NOMME `.State.Error`, et c'est assumé : ce champ est le vrai
# apport du lab, aucune question ne le demande, et un apprenant qui l'ignore
# repartira sans ce qui lui aurait fait gagner une heure. À ce coût, le nommer
# est un service, pas une fuite.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici la plus
# fréquente est d'avoir répondu le statut qu'on attendait plutôt que celui que
# le moteur déclare.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-exit127.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
