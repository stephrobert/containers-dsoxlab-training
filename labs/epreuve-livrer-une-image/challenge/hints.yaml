# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UNE ÉPREUVE, et les indices y sont plus avares qu'ailleurs. Le troisième
# nomme l'option qui monte un secret, parce que c'est une connaissance et non la
# réponse ; aucun n'écrit l'instruction à la place du candidat.
#
# AUCUN NE DONNE L'EMPREINTE. Elle est tirée au hasard à chaque passage, et ne
# se devine pas : elle se calcule depuis le secret, ou se lit dans l'image une
# fois construite. Le générateur le vérifie.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer ce
# qui montre la faute quand tout semble juste sans l'être. Sur cette épreuve, la
# plus trompeuse est un `docker push` du compte lecteur qui rend 0 : repousser
# un contenu déjà présent n'écrit rien, donc ne demande aucun droit, et ne
# mesure donc rien.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session (`hints-livraison.py`)
# puis encodés : un indice écrit directement en base64 ne se relit pas, et c'est
# ainsi que deux labs d'un catalogue frère ont été livrés avec les indices du
# générateur.
