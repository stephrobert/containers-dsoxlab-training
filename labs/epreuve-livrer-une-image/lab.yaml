# Lab epreuve-livrer-une-image. Metadonnees posees le 2026-11-01 d'apres l'audit du plan de
# formation : scenario, setup et tests restent a ecrire APRES mesure sur la
# machine (regle B). Voir LABS-A-ECRIRE-AUDIT.md a la racine du catalogue.
id: epreuve-livrer-une-image
title: Deliver an image a bare client can actually run
level: c2
description: Build, publish and pull an image by digest from a bare second host with read-only
  credentials, prove it answers there, and prove the build secret survived in no layer.
skills:
- docker
- registre
- digest
- secrets-de-build
- acl
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/epreuves/livrer-une-image-utilisable-ailleurs/#passer-lépreuve
lab_type: challenge
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: cible
    host: docker.lab
    roles:
      client: docker-client.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, appliquee par le
  # moteur depuis dsoxlab 0.7.0. Chaque nom a ete verifie sur
  # ce que le controle AFFIRME, et non sur son intitule.
  - test_le_secret_a_servi_et_ne_survit_dans_aucune_couche
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: livraison-utilisable
    label: "The delivery is published and a bare client can pull it and run it"
    tests:
      - test_la_livraison_est_publiee_et_designee_par_son_digest
      - test_le_client_nu_tire_par_digest_et_execute
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/registres/docker-hub/
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/identite-d-une-image/
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/epingler-et-livrer-hors-ligne/
  - id: secret-de-build
    label: "The build secret was used and left no trace in the image"
    tests:
      - test_le_secret_a_servi_et_ne_survit_dans_aucune_couche
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/build/buildkit/
  - id: droits-du-registre
    label: "A read-only account cannot publish to the registry"
    tests:
      - test_le_compte_en_lecture_seule_ne_peut_pas_publier
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/registres/distribution/
