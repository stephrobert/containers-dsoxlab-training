id: securite-socket-lecture-seule
title: "Remove direct Docker socket access"
level: c6
description: "Remove the capability to reach the daemon socket, by any path: read-only applies to the socket file, not to the requests travelling through it."
skills:
  - docker
  - socket
  - least-privilege
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/retirer-les-acces-directs/#mettre-en-pratique
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
