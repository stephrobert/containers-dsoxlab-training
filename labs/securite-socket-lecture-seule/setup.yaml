---
- name: Prepare lab securite-socket-lecture-seule
  hosts: lab_target
  become: true
  vars:
    pinned_image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  tasks:
    - name: Noter si le socle public etait deja present
      # UN LAB NE REND QUE CE QU'IL A POSE, et il rend tout ce qu'il a pose. Ce
      # lab TIRAIT le socle sans jamais le retirer : le validateur comptait
      # « image laisse », et le lab suivant heritait d'un moteur modifie. Le
      # marqueur dit au cleanup s'il doit rendre l'image, ou la laisser parce
      # qu'elle etait deja la.
      ansible.builtin.shell: |
        set -eu
        if docker image inspect 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1; then
          rm -f '/var/tmp/dsoxlab-securite-socket-lecture-seule.socle-a-rendre'
        else
          : > '/var/tmp/dsoxlab-securite-socket-lecture-seule.socle-a-rendre'
        fi
      changed_when: false

    - name: Install Docker and the small test runtime
      ansible.builtin.apt:
        name: [docker-ce, python3]
        state: present
        update_cache: true
    - name: Ensure Docker is available for this host lab
      ansible.builtin.systemd_service:
        name: docker
        state: started
    - name: Refuse to overwrite lab-labelled containers or volumes
      ansible.builtin.shell: |
        set -eu
        test -z "$(docker ps -aq --filter label=dsoxlab.lab=securite-socket-lecture-seule)"
        test -z "$(docker volume ls -q --filter label=dsoxlab.lab=securite-socket-lecture-seule)"
      args:
        executable: /bin/sh
      changed_when: false
    - name: Refuse to overwrite a previous lab work directory
      ansible.builtin.stat:
        path: /opt/dsoxlab-securite-socket-lecture-seule
      register: workdir_state
    - name: Require a clean lab work directory
      ansible.builtin.assert:
        that: not workdir_state.stat.exists
        fail_msg: "/opt/dsoxlab-securite-socket-lecture-seule already exists; cleanup must restore the previous run first."
    - name: Create the unique lab work directory
      ansible.builtin.file:
        path: /opt/dsoxlab-securite-socket-lecture-seule
        state: directory
        mode: "0750"
    - name: Check whether the pinned image is already present
      ansible.builtin.command: docker image inspect "{{ pinned_image }}"
      register: image_state
      changed_when: false
      failed_when: false
    - name: Pull the pinned disposable image only when absent
      ansible.builtin.command: docker pull "{{ pinned_image }}"
      when: image_state.rc != 0
    - name: Create the starter container with a misleading read-only socket bind
      ansible.builtin.command: >-
        docker run --detach --name dsoxlab-socket-readonly
        --label dsoxlab.lab=securite-socket-lecture-seule
        --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock,readonly
        {{ pinned_image }} sh -c 'while :; do sleep 3600; done'
    - name: Install this lab's bilingual mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/dsoxlab-securite-socket-lecture-seule/MISSION.md
        mode: "0644"
