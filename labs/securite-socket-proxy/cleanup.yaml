---
- name: Clean lab securite-socket-proxy
  hosts: lab_target
  become: true
  tasks:
    - name: Check whether setup owns the proxy service
      ansible.builtin.stat:
        path: /opt/dsoxlab-securite-socket-proxy/service-owned
      register: proxy_service_marker
    - name: Stop and remove only the lab proxy service
      ansible.builtin.systemd_service:
        name: dsoxlab-securite-socket-proxy.service
        state: stopped
        enabled: false
        daemon_reload: true
      failed_when: false
      when: proxy_service_marker.stat.exists
    - name: Remove the lab proxy unit only
      ansible.builtin.file:
        path: /etc/systemd/system/dsoxlab-securite-socket-proxy.service
        state: absent
      when: proxy_service_marker.stat.exists
    - name: Reload systemd after removing the lab proxy unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: proxy_service_marker.stat.exists
    - name: Remove only containers carrying this lab's label
      ansible.builtin.shell: |
        set -eu
        ids="$(docker ps -aq --filter label=dsoxlab.lab=securite-socket-proxy)"
        if [ -n "$ids" ]; then docker rm -f $ids; fi
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false
    - name: Remove only volumes carrying this lab's label
      ansible.builtin.shell: |
        set -eu
        ids="$(docker volume ls -q --filter label=dsoxlab.lab=securite-socket-proxy)"
        if [ -n "$ids" ]; then docker volume rm $ids; fi
      args:
        executable: /bin/sh
      changed_when: false
      failed_when: false
    - name: Remove the unique work directory created for this lab
      ansible.builtin.file:
        path: /opt/dsoxlab-securite-socket-proxy
        state: absent
