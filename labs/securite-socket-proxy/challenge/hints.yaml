# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER FAIT FAIRE LE CONSTAT et ne donne rien du travail : l'apprenant
# monte le socket en lecture seule, voit l'arrêt réussir, et en tire lui-même
# que le filtrage doit venir d'ailleurs que des droits du fichier.
#
# LE DEUXIÈME DONNE LA FORME de la réponse sans ses commandes, et nomme le piège
# des variables fixées à la création.
#
# LE TROISIÈME DONNE LES COMMANDES, profil compris, et la forme `-I` plutôt que
# `-X HEAD`, qui bloque.
#
# LE QUATRIÈME a l'emploi que ce dépôt lui donne : nommer ce qui montre la faute
# quand tout semble juste. Sa dernière ligne écarte une attente légitime mais
# fausse, à savoir que `--internal` isolerait le proxy de l'hôte.
#
# AUCUN INDICE NE DONNE `POST=1` COMME UNE PISTE : c'est la combinaison que le
# lab existe pour écarter, et la nommer comme un moyen l'enseignerait.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-socket-proxy.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
