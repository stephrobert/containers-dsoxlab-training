---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab images-epingler-par-digest
  hosts: lab_target
  become: true
  tasks:
    - name: Retirer uniquement les objets Docker du lab
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          if docker container inspect dsoxlab-pin-registry >/dev/null 2>&1; then
            docker rm -f dsoxlab-pin-registry
          fi
          images=$(docker image ls -aq --filter label=dsoxlab.lab=images-epingler-par-digest)
          if test -n "$images"; then docker image rm -f $images; fi
      changed_when: false

    - name: Retirer l'atelier, le relevé et la mission
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-image-pin
        - /root/.lab-image-pin.json
        - /opt/MISSION.md
