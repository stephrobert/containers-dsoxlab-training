# Lab images-epingler-par-digest. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: images-epingler-par-digest                      # REQUIS
title: "Keep a rebuild on its approved base when a tag moves"
level: c2                     # REQUIS
description: "Pin a build to its approved registry manifest, rebuild after a source change, and prove that replacing the base tag does not change the delivered base."
skills:                       # REQUIS, non vide
  - docker
  - dockerfile
  - image-digest
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/registres/#tags-vs-digests--la-distinction-critique   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
