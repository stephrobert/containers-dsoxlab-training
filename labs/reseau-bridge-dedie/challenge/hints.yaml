# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB N'A AUCUNE RÉPONSE À DONNER : il demande des gestes, pas des valeurs.
# Les indices dosent donc la nomination de ces gestes, et le troisième va
# jusqu'aux commandes exactes, ce qui est légitime à ce coût : le savoir-faire
# du lab n'est pas de deviner un nom de sous-commande, c'est de comprendre
# qu'un déplacement en demande deux.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici c'est
# particulièrement vrai : attacher sans détacher donne un lab qui a l'air
# réussi, nom résolu et connexion passante, et dont l'isolation n'existe pas.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-bridge-dedie.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
