---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# L'ORDRE COMPTE ICI. Un réseau dont des conteneurs sont encore membres ne se
# supprime pas : `docker network rm` refuse avec « has active endpoints ». Les
# conteneurs partent donc d'abord, et le réseau ensuite. C'est exactement le
# genre de dépendance qu'un cleanup écrit à l'envers fait découvrir au premier
# `dsoxlab reset`, dans un message qui ne dit pas la cause.
#
# LE RÉSEAU `atelier` EST RETIRÉ même si c'est l'apprenant qui l'a créé : sans
# cela, trois contrôles sur quatre seraient vrais au passage suivant avant tout
# travail. Le réseau par défaut, lui, n'est pas touché : il appartient au
# moteur.
- name: Défaire le lab reseau-bridge-dedie
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    tag_local: lab-reseau-dedie:1.0
    reseau_demande: atelier
  tasks:
    - name: Retirer les trois conteneurs, AVANT le réseau dont ils sont membres
      ansible.builtin.shell:
        cmd: docker rm -f avant arriere tiers 2>/dev/null || true
      changed_when: false

    - name: Retirer le réseau du lab, maintenant qu'il n'a plus de membre
      ansible.builtin.shell:
        cmd: docker network rm {{ reseau_demande }} 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} {{ image_epinglee }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer l'énoncé
      ansible.builtin.file:
        path: /opt/MISSION.md
        state: absent
