---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# LES EMPREINTES DOIVENT PARTIR, et c'est le geste décisif de ce cleanup. Elles
# portent le PID du démon relevé au passage précédent : si elles survivaient, le
# quatrième contrôle comparerait le démon d'aujourd'hui à celui d'hier, les
# trouverait différents, et conclurait à un redémarrage qui n'a pas eu lieu.
#
# LE DÉMON N'EST PAS REMIS DANS SON ÉTAT D'ORIGINE, et il n'y a rien à remettre :
# l'apprenant l'a redémarré, ce qui est le geste attendu, et un démon redémarré
# est un démon en état. Le lab suivant relèvera son nouveau PID.
- name: Défaire le lab internes-chaine-dexecution
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-chaine:1.0
    atelier: /opt/lab-chaine
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-internes-chaine-dexecution.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-internes-chaine-dexecution.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer le conteneur du lab
      ansible.builtin.shell:
        cmd: docker rm -f maillon maillon-bis 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de travail, les empreintes et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md

    # LE DÉMON DOIT ÊTRE DEBOUT À LA FIN. L'apprenant a pu l'arrêter au lieu de
    # le redémarrer, et le lab suivant partirait alors d'une machine sans moteur.
    - name: S'assurer que le moteur est bien debout après le passage
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop:
        - docker.socket
        - docker
