# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LES TROIS RÉPONSES SONT PROPRES À L'INSTANCE, et les indices n'en portent
# donc aucune : un PID n'existe que sur la machine de l'apprenant et change à
# chaque démarrage. C'est ce qui a motivé leur réécriture le 2026-11-02 : deux
# des trois réponses étaient des constantes (`1` pour le parent du shim, `runc`
# pour le runtime) que la leçon hébergeant ce lab enseigne et mesure. Elles se
# recopiaient de la page.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa première cause
# est inhabituelle et c'est la plus fréquente sur ce lab : l'apprenant a REFUSÉ
# sa propre réponse parce qu'elle lui paraissait absurde. L'indice le rassure
# sans la nommer, ce qui ne lui épargne pas de l'avoir trouvée.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-chaine.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
