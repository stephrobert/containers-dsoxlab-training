id: internes-chaine-dexecution                      # REQUIS
title: "Who really starts a container"            # REQUIS
level: c6                     # REQUIS
description: "Walk the chain between the daemon and a container's process, discover that its parent is none of the ones you expect, then start a second container and see that it has its own intermediary, detached towards the same parent."
skills:                       # REQUIS, non vide
  - docker
  - internes
  - runtime
  - processus
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/chaine-d-execution/#mettre-en-pratique   # REQUIS, http(s)
lab_type: lab
estimated_time: 35m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
