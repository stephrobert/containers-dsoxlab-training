# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB N'A PAS DE FORMULAIRE : la réponse est une instruction réécrite. Le
# générateur vérifie donc que les deux premiers indices ne livrent pas
# l'écriture attendue, et qu'AUCUN ne propose d'aplatir l'image : ce serait
# envoyer l'apprenant vers la faute que le quatrième contrôle refuse.
#
# LE PREMIER NE CORRIGE RIEN : il fait peser l'image, puis chaque couche, et
# pose ce qu'est une couche. C'est le raisonnement du lab, et il vaut plus
# qu'une ligne recopiée.
#
# LE DEUXIÈME ÉCARTE DEUX FAUSSES PISTES : alléger en ne produisant plus rien,
# que le premier contrôle refuse, et le mythe du nombre de couches, qui ferait
# défaire ce que le lab sur l'ordre des couches a enseigné.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa dernière cause
# est l'aplatissement, qui donne la bonne taille et perd le partage de couches.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-taille.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
