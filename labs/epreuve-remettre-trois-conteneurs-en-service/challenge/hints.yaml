# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UNE ÉPREUVE, et le dosage n'est donc pas celui d'un lab. Les deux
# premiers indices ne nomment AUCUNE cause : le premier donne la méthode, qui
# est ici de traiter les trois pannes séparément, le second les commandes qui
# établissent l'état. Les causes n'apparaissent qu'au troisième.
#
# LE PREMIER INDICE RAPPELLE L'EXIGENCE CRITIQUE, et c'est délibéré : elle est
# déjà dans l'énoncé, donc la redire ne divulgue rien, et un apprenant qui prend
# un indice parce qu'il est bloqué ne doit pas y perdre l'épreuve entière.
#
# Le quatrième nomme les CORRECTIONS INCOMPLÈTES. La première qu'il cite est la
# plus tentante du catalogue : retirer la politique de redémarrage fait
# disparaître le symptôme en une commande, et rend la panne invisible.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-trois-pannes.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
