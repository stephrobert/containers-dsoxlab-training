# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE DONNE LES TROIS VALEURS attendues. Ce sont les trois réponses, et
# elles se diagnostiquent. Le générateur vérifie qu'elles n'y figurent pas.
#
# LE PREMIER NE DONNE AUCUNE COMMANDE : il demande d'essayer les deux écritures
# à la main et de comparer les deux refus mot à mot. C'est le raisonnement du
# lab, et il vaut plus que n'importe quelle commande.
#
# LE DEUXIÈME DIT DE LIRE LE CODE SUR LE TÉMOIN, et dit pourquoi : une valeur de
# diagnostic ne se lit pas sur un objet que la réparation modifie. Laisser
# l'apprenant lire le code sur le conteneur qu'il vient de réparer lui ferait
# chercher une valeur qui n'existe plus.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ses deux
# premières causes sont les deux pièges du lab : avoir réparé le témoin, et
# avoir réglé le symptôme en passant root.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-permission.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
