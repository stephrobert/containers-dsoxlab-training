---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# LE RÉPERTOIRE DOIT PARTIR EN ENTIER, et c'est le geste décisif. Les trois
# pannes vivent dans ses droits et dans le mode d'un fichier : s'il survivait
# réparé, les trois contrôles de réparation seraient vrais au passage suivant
# avant tout travail.
#
# Le recréer coûte moins cher que de remettre chaque droit en place, et surtout
# cela ne peut pas en oublier un.
- name: Défaire le lab troubleshoot-permission-refusee
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-permission:1.0
    atelier: /opt/lab-permission
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-troubleshoot-permission-refusee.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-troubleshoot-permission-refusee.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les quatre conteneurs du lab
      ansible.builtin.shell:
        cmd: >
          docker rm -f perm-a perm-b perm-c temoin-sans-bit
          2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire entier, droits et modes compris, et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
