title: "Deliver a complete image without its source registry"
level: c2                     # REQUIS
description: "Package a published image with an integrity checksum and prove offline recovery without relying on Docker's local cache."
skills:                       # REQUIS, non vide
  - docker
  - skopeo
  - registry
  - air-gap
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/outils/skopeo/#environnements-air-gap-déconnectés   # REQUIS, http(s)
lab_type: challenge
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
