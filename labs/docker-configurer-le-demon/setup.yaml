---
- name: Prepare lab docker-configurer-le-demon
  hosts: lab_target
  become: true
  vars:
    lab_user: "{{ ansible_user | default('student') }}"
    pinned_image: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  tasks:
    - name: Install Docker and the small test runtime
      ansible.builtin.apt:
        name: [docker.io, python3]
        state: present
        update_cache: true
    - name: Ensure Docker is available for this host lab
      ansible.builtin.systemd_service:
        name: docker
        state: started
    - name: Refuse to overwrite lab-labelled containers or volumes
      ansible.builtin.shell: |
        set -eu
        test -z "$(docker ps -aq --filter label=dsoxlab.lab=docker-configurer-le-demon)"
        test -z "$(docker volume ls -q --filter label=dsoxlab.lab=docker-configurer-le-demon)"
      args:
        executable: /bin/sh
      changed_when: false
    - name: Refuse to overwrite a previous lab work directory
      ansible.builtin.stat:
        path: /opt/dsoxlab-docker-configurer-le-demon
      register: workdir_state
    - name: Require a clean lab work directory
      ansible.builtin.assert:
        that: not workdir_state.stat.exists
        fail_msg: "/opt/dsoxlab-docker-configurer-le-demon already exists; cleanup must restore the previous run first."
    - name: Create the unique lab work directory
      ansible.builtin.file:
        path: /opt/dsoxlab-docker-configurer-le-demon
        state: directory
        owner: "{{ lab_user }}"
        group: "{{ lab_user }}"
        mode: "0750"
    - name: Check whether the pinned image is already present
      ansible.builtin.command: docker image inspect "{{ pinned_image }}"
      register: image_state
      changed_when: false
      failed_when: false
    - name: Pull the pinned disposable image only when absent
      ansible.builtin.command: docker pull "{{ pinned_image }}"
      when: image_state.rc != 0
    - name: Save whether daemon.json exists
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: daemon_config
    - name: Save original daemon configuration when present
      ansible.builtin.copy:
        src: /etc/docker/daemon.json
        dest: /opt/dsoxlab-docker-configurer-le-demon/daemon.json.before
        remote_src: true
        mode: "0600"
      when: daemon_config.stat.exists
    - name: Record original configuration presence
      ansible.builtin.copy:
        dest: /opt/dsoxlab-docker-configurer-le-demon/config-presence
        content: "{{ 'present' if daemon_config.stat.exists else 'absent' }}\n"
        mode: "0600"
    - name: Install this lab's bilingual mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/dsoxlab-docker-configurer-le-demon/MISSION.md
        owner: "{{ lab_user }}"
        group: "{{ lab_user }}"
        mode: "0644"
