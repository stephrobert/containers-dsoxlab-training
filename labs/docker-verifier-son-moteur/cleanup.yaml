---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# CE QU'IL FAUT VRAIMENT DÉFAIRE. Le validateur photographie les images, les
# conteneurs et les volumes avant et après, et n'admet aucun écart. Le setup
# pose une image et son tag ; le travail de l'apprenant laisse au moins un
# conteneur terminé. Les deux se retirent ici, sans quoi le lab suivant
# trouverait un état qu'il n'a pas posé.
#
# ET ON REND LE MOTEUR EN ÉTAT. Le setup l'a délibérément cassé : le laisser
# ainsi ferait payer à tout le reste du catalogue la mise en situation de ce
# lab-ci. Un `clean` rend la machine utilisable, il ne rend pas la panne.
- name: Défaire le lab docker-verifier-son-moteur
  hosts: lab_target
  become: true
  vars:
    compte_apprenant: "{{ ansible_user | default('ansible') }}"
  tasks:
    - name: Remettre le socket et le service en service
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker.socket
        - docker

    - name: Rendre au compte son accès au moteur
      ansible.builtin.user:
        name: "{{ compte_apprenant }}"
        groups: docker
        append: true

    - name: Retirer les conteneurs laissés par la mission
      ansible.builtin.shell:
        cmd: docker container prune -f || true
      changed_when: false

    - name: Retirer le tag posé par le setup, puis l'image elle-même
      ansible.builtin.shell:
        cmd: >
          docker rmi -f lab-preuve:1.0
          hello-world@sha256:c567b231f65614688711a75f31518a064258a51d442117a3e771a3a8fdba78ef
          || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer l'énoncé déposé sur la machine
      ansible.builtin.file:
        path: /opt/MISSION.md
        state: absent
