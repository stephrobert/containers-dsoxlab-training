---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab compose-isolation-reseau
  hosts: lab_target
  become: true
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-compose-isolation-reseau.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-compose-isolation-reseau.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les ressources propres au projet
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          containers=$(docker container ls -aq --filter label=com.docker.compose.project=dsoxlab-isolation-reseau)
          if test -n "$containers"; then docker container rm -f $containers; fi
          networks=$(docker network ls -q --filter label=com.docker.compose.project=dsoxlab-isolation-reseau)
          if test -n "$networks"; then docker network rm $networks; fi
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=dsoxlab-isolation-reseau)
          if test -n "$volumes"; then docker volume rm $volumes; fi
          images=$(docker image ls -aq --filter label=dsoxlab.lab=compose-isolation-reseau)
          if test -n "$images"; then docker image rm -f $images; fi
      changed_when: false

    - name: Retirer les fichiers propres au lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-compose-net
        - /root/.lab-compose-net.json
        - /opt/MISSION.md
