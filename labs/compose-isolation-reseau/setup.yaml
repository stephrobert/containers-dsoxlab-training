---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab compose-isolation-reseau
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Docker et Compose
      ansible.builtin.apt:
        name: [docker.io, docker-compose, curl]
        state: present
        update_cache: true

    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true

    - name: Créer les contextes
      ansible.builtin.file:
        path: "/opt/lab-compose-net/{{ item }}"
        state: directory
        mode: "0755"
      loop: [front/www/cgi-bin, api/www/cgi-bin, data/www]

    - name: Tirer Alpine épinglée
      ansible.builtin.command:
        cmd: docker pull alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
      register: pulled
      changed_when: "'Downloaded newer image' in pulled.stdout"

    - name: Tirer la valeur des données
      ansible.builtin.set_fact:
        value: "data-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters']) }}"

    - name: Déposer les données
      ansible.builtin.copy:
        dest: /opt/lab-compose-net/data/www/value.txt
        mode: "0644"
        content: "{{ value }}\n"

    - name: Déposer le relais API vers les données
      ansible.builtin.copy:
        dest: /opt/lab-compose-net/api/www/cgi-bin/value
        mode: "0755"
        content: |
          #!/bin/sh
          printf 'Content-Type: text/plain\r\n\r\n'
          wget -qO- http://data:8080/value.txt

    - name: Déposer le relais façade vers API
      ansible.builtin.copy:
        dest: /opt/lab-compose-net/front/www/cgi-bin/value
        mode: "0755"
        content: |
          #!/bin/sh
          printf 'Content-Type: text/plain\r\n\r\n'
          wget -qO- http://api:8080/cgi-bin/value

    - name: Déposer les Dockerfiles
      ansible.builtin.copy:
        dest: "/opt/lab-compose-net/{{ item }}/Dockerfile"
        mode: "0644"
        content: |
          FROM alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
          LABEL dsoxlab.lab="compose-isolation-reseau"
          RUN apk add --no-cache busybox-extras
          COPY www /www
          CMD ["busybox-extras", "httpd", "-f", "-p", "8080", "-h", "/www"]
      loop: [front, api, data]

    - name: Construire les images sans lancer les services
      ansible.builtin.command:
        cmd: docker build -t dsoxlab-compose-net:{{ item }} /opt/lab-compose-net/{{ item }}
      loop: [front, api, data]
      changed_when: true

    - name: Garder la valeur attendue
      ansible.builtin.copy:
        dest: /root/.lab-compose-net.json
        mode: "0600"
        content: "{{ {'value': value} | to_json }}"

    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
