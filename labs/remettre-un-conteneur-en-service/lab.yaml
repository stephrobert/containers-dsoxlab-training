# Challenge remettre-un-conteneur-en-service. Les champs marqués REQUIS sont exigés par le validator :
# sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
#
# `lab_type: challenge` et non `lab` : c'est ce qui autorise
# `exam_passing_score`, et ce qui dit à l'apprenant que cette épreuve ÉVALUE.
# Rien n'y est réexpliqué : les labs réseau du parcours l'ont enseigné.
id: remettre-un-conteneur-en-service                      # REQUIS
title: "The shop cannot find its catalogue"            # REQUIS
level: c3                     # REQUIS
description: "Repair real name resolution, access and exposure faults, then recreate the catalogue without losing a fresh persistent business value."
skills:                       # REQUIS, non vide
  - docker
  - reseau
  - dns
  - diagnostic
  - persistence
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/epreuves/1-remettre-un-conteneur-en-service/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  - test_la_recreation_conserve_la_donnee_et_la_reponse_metier
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: recreation-sans-perte
    label: "Replacing the database container loses no data and the business answer holds"
    tests:
      - test_la_recreation_conserve_la_donnee_et_la_reponse_metier
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/volumes/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/cycle-de-vie-et-signaux/
  - id: noms-resolus
    label: "The application reaches its database by the name it uses, and operations keep the real name"
    tests:
      - test_le_nom_attendu_par_l_application_se_resout
      - test_l_application_joint_sa_base_par_ce_nom
      - test_le_nom_reel_de_la_base_se_resout_aussi
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/network/
  - id: base-non-publiee
    label: "The database publishes no port"
    tests:
      - test_la_base_ne_publie_aucun_port
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/publier-un-port/
estimated_time: 45m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
