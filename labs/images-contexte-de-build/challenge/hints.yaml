# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB N'A PAS DE FORMULAIRE : la réponse est un Dockerfile, un script et une
# exclusion. Le générateur vérifie donc que les deux premiers indices ne livrent
# ni l'option qui désigne le Dockerfile, ni la commande de construction, ni le
# nom du fichier d'exclusion.
#
# LE PREMIER NE CORRIGE RIEN : il demande de tenir les deux affirmations
# ensemble, « le fichier est introuvable » et « le fichier existe », et de se
# demander ce que le moteur pouvait voir. C'est le raisonnement du lab, et il
# vaut plus qu'une option recopiée.
#
# LE DEUXIÈME SÉPARE LES TROIS DÉCISIONS qu'on confond : le périmètre, où vit
# le Dockerfile, et ce qui entre dans l'image. Il dit aussi expressément de ne
# pas recopier le fichier partagé : c'est la réponse en une commande, et un
# contrôle la refuse.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa dernière
# ligne rassure sur un point qui inquiète à juste titre : un contrôle
# reconstruit sous le nom de l'image de l'apprenant, et il la lui rend.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-contexte.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
