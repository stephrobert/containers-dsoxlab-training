# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UN CAPSTONE, et les indices y sont les plus avares du catalogue. Le
# premier ne donne qu'une méthode, pas un geste.
#
# AUCUN NE DIT CE QUI A ÉTÉ DÉTRUIT. L'établir est la première question de
# l'épreuve, et un indice qui le dirait la supprimerait. Aucun ne donne le
# témoin non plus : il est tiré au hasard à chaque passage, et se lit dans la
# sauvegarde. Le générateur vérifie les deux.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer ce
# qui montre la faute quand tout semble juste sans l'être. Sur cette épreuve, la
# plus fréquente est d'avoir aplati les réseaux pour que la restauration marche,
# et la plus sournoise d'avoir écrit la donnée dans la couche du conteneur au
# lieu du volume : tout répond, jusqu'au premier `recreate`.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`hints-restauration.py`) puis encodés : un indice écrit directement en base64
# ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont été
# livrés avec les indices du générateur.
