# Lab epreuve-restaurer-une-stack. Metadonnees posees le 2026-11-01 d'apres
# l'audit du plan de formation, puis scenario, setup et tests ECRITS et mesures
# sur la machine. L'en-tete disait encore « restent a ecrire » le 2026-11-05,
# alors que les trois existaient et que le lab etait atteste : un commentaire
# qui survit a ce qu'il decrit fait ecrire du faux avec assurance.
#
# Ce lab est l'epreuve du niveau 2 de la formation, le module exploiter-une-stack
# ayant rejoint n2 le 2026-11-02.
id: epreuve-restaurer-une-stack
title: Restore a stack on another host, data included
level: c4
description: 'A business request crosses the front end, the API and the database. A fault is injected
  without being announced: restore the service AND the witness record on a distinct host, without
  removing the data network isolation.'
skills:
- docker
- compose
- sauvegarde
- restauration
- isolation
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/epreuves/3-exploiter-et-restaurer-une-stack/#passer-lépreuve
lab_type: capstone
estimated_time: 60m
runtime:
  type: vm
  targets:
  - name: cible
    host: docker.lab
    roles:
      client: docker-client.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, appliquee par le
  # moteur depuis dsoxlab 0.7.0. Chaque nom a ete verifie sur
  # ce que le controle AFFIRME, et non sur son intitule.
  - test_le_temoin_a_ete_restaure
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: pile-remontee
    label: "The stack is back up elsewhere and a request crosses its three tiers"
    tests:
      - test_les_trois_etages_tournent_sur_le_client_et_la_requete_les_traverse
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/sauvegarder-et-restaurer/
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/
  - id: temoin-restaure
    label: "The witness data is restored and served"
    tests:
      - test_le_temoin_a_ete_restaure
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/sauvegarder-et-restaurer/
  - id: reseau-de-donnees-isole
    label: "The data network stays isolated"
    tests:
      - test_le_reseau_de_donnees_est_reste_isole
      - test_la_sonde_sur_le_reseau_public_n_atteint_pas_la_base
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/reseaux/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/reseau-interne/
