---
- name: Remove only multi-architecture workshop objects
  hosts: lab_target
  become: true
  tasks:
    - name: Remove the labelled registry and local release variants
      ansible.builtin.shell:
        cmd: |
          set -eu
          if docker container inspect dsoxlab-multiarch-registry >/dev/null 2>&1; then
            docker rm -f dsoxlab-multiarch-registry
          fi
          images=$(docker image ls -aq --filter label=dsoxlab.lab=images-multi-architecture)
          if test -n "$images"; then docker image rm -f $images; fi
          if test -d /opt/lab-multiarch && ! test -f /opt/lab-multiarch/registry-preexisting; then
            image='registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3'
            if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
          fi
      changed_when: false
    - name: Remove workspace
      ansible.builtin.file:
        path: /opt/lab-multiarch
        state: absent
