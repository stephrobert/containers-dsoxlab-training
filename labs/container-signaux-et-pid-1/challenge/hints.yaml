# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite, et aucun ne donne la réponse.
#
# Le premier n'oriente vers aucune correction : il fait REGARDER la durée de
# l'arrêt et le PID 1. C'est le geste de diagnostic que le lab enseigne, et le
# donner d'abord vaut mieux que de le garder pour la fin.
#
# Le deuxième décrit le mot à trouver sans l'écrire : « il tient en quatre
# lettres ». C'est le seul endroit du lab où l'indice doit résister, parce que
# ce mot EST la compétence.
#
# Le quatrième a l'emploi que ce dépôt lui réserve : nommer ce qui montre la
# faute quand tout semble juste sans l'être. Ici les trois pièges du lab, dont
# deux sont des fausses corrections.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-signaux.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
