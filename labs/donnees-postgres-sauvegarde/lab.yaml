id: donnees-postgres-sauvegarde
title: "Back up and restore PostgreSQL data"
level: c3
description: "Create a consistent PostgreSQL custom-format backup, restore it into an isolated database, and verify restored rows against the live source."
skills:
  - postgresql
  - database-backup
  - data-restore
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/volumes/#sauvegarderestauration-des-volumes-docker
lab_type: challenge
estimated_time: 40m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
