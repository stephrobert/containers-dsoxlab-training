id: donnees-postgres-sauvegarde
title: "Restore PostgreSQL data on a second VM"
level: c3
description: "Create a consistent PostgreSQL custom-format backup, transfer it to a second VM, restore a fresh database there, and verify the running service and every row against the live source."
skills:
  - postgresql
  - database-backup
  - data-restore
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/volumes/#sauvegarderestauration-des-volumes-docker
lab_type: challenge
estimated_time: 40m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
      roles:
        restore: docker-client.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
