---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab compose-resolution-des-variables
  hosts: lab_target
  become: true
  tasks:
    - name: Noter si le socle public etait deja present
      # UN LAB NE REND QUE CE QU'IL A POSE, et il rend tout ce qu'il a pose. Ce
      # lab TIRAIT le socle sans jamais le retirer : le validateur comptait
      # « image laisse », et le lab suivant heritait d'un moteur modifie. Le
      # marqueur dit au cleanup s'il doit rendre l'image, ou la laisser parce
      # qu'elle etait deja la.
      ansible.builtin.shell: |
        set -eu
        if docker image inspect 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1; then
          rm -f '/var/tmp/dsoxlab-compose-resolution-des-variables.socle-a-rendre'
        else
          : > '/var/tmp/dsoxlab-compose-resolution-des-variables.socle-a-rendre'
        fi
      changed_when: false

    - name: Installer Docker et Compose v2
      ansible.builtin.apt:
        name: [docker-ce, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true

    - name: Tirer Alpine épinglée
      ansible.builtin.command:
        cmd: docker pull alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      register: pulled
      changed_when: "'Downloaded newer image' in pulled.stdout"

    - name: Créer le dossier de travail
      ansible.builtin.file:
        path: /opt/lab-compose-vars
        state: directory
        mode: "0755"

    - name: Tirer les valeurs pédagogiques
      ansible.builtin.set_fact:
        release: "release-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters']) }}"
        runtime_only: "runtime-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters']) }}"

    - name: Déposer le fichier d'interpolation explicite
      ansible.builtin.copy:
        dest: /opt/lab-compose-vars/deploy.env
        mode: "0644"
        content: |
          IMAGE_REF=alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          APP_RELEASE={{ release }}

    - name: Déposer les valeurs destinées au conteneur
      ansible.builtin.copy:
        dest: /opt/lab-compose-vars/runtime.env
        mode: "0644"
        content: |
          APP_MODE=staging
          RUNTIME_ONLY={{ runtime_only }}

    - name: Déposer un environnement implicite trompeur
      ansible.builtin.copy:
        dest: /opt/lab-compose-vars/.env
        mode: "0644"
        content: |
          IMAGE_REF=alpine:do-not-pull
          APP_RELEASE=wrong-implicit-release

    - name: Déposer la déclaration à réparer
      ansible.builtin.copy:
        dest: /opt/lab-compose-vars/compose.yaml
        mode: "0644"
        content: |
          services:
            app:
              image: ${IMAGE_REF}
              env_file: runtime.env
              environment:
                APP_RELEASE: wrong-hardcoded-release
              command:
                - sh
                - -c
                - 'printf "%s\n" "${APP_MODE}:${APP_RELEASE}:${RUNTIME_ONLY}" > /tmp/report; exec sleep infinity'

    - name: Conserver les valeurs et empreintes des fichiers fournis
      ansible.builtin.shell:
        cmd: |
          set -eu
          cd /opt/lab-compose-vars
          sha256sum deploy.env runtime.env .env > /root/.lab-compose-vars.sha256
      changed_when: true

    - name: Conserver les valeurs attendues
      ansible.builtin.copy:
        dest: /root/.lab-compose-vars.json
        mode: "0600"
        content: "{{ {'release': release, 'runtime_only': runtime_only} | to_json }}"

    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
