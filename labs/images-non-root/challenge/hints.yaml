# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE GARDE-FOU DU GÉNÉRATEUR vérifie que les deux premiers indices ne livrent ni
# l'instruction qui aligne le propriétaire ni la forme numérique de la
# déclaration, et qu'AUCUN ne propose un mode ouvert à tous : ce serait envoyer
# l'apprenant vers la faute que le troisième contrôle refuse.
#
# LE PREMIER FAIT FAIRE LA MANIPULATION : ajouter la ligne, constater que
# l'application cesse d'écrire, et comprendre que cette ligne n'a touché aucun
# droit. C'est le raisonnement du lab, et il vaut plus qu'une instruction
# recopiée.
#
# LE DEUXIÈME SÉPARE LES TROIS DÉCISIONS qu'on confond : l'identité
# d'exécution, les droits des fichiers, et la déclaration que l'image
# transmet. Il nomme les deux pièges, dont celui qu'un contrôle refuse bien
# qu'il marche.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa dernière cause
# est l'ordre des instructions, qui ne se devine pas.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-nonroot.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
