---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# LE RÉPERTOIRE PART EN ENTIER : il porte le Dockerfile corrigé, et s'il
# survivait, les quatre contrôles seraient vrais au passage suivant avant tout
# travail.
- name: Défaire le lab images-non-root
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    socle: lab-nonroot:1.0
    atelier: /opt/lab-nonroot
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-images-non-root.socle-a-rendre'; then
          docker image rm -f 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-images-non-root.socle-a-rendre'
        fi
      changed_when: false

    # LES CONTENEURS D'ESSAI, par leurs noms. Un test interrompu en laisserait
    # un, et le filtre par image ne suffit pas : l'image peut déjà être partie.
    - name: Retirer les conteneurs d'essai des contrôles et de la solution
      ansible.builtin.shell:
        cmd: >
          docker rm -f dsoxlab-essai-nonroot dsoxlab-essai-solution-nonroot
          2>/dev/null || true
      changed_when: false

    - name: Retirer les conteneurs dérivés de l'image du lab
      ansible.builtin.shell:
        cmd: >
          docker ps -aq --filter ancestor=appli:nonroot
          | xargs -r docker rm -f
          2>/dev/null || true
      changed_when: false

    - name: Retirer les images du lab, celle de l'apprenant et le socle
      ansible.builtin.shell:
        cmd: >
          docker rmi -f appli:nonroot {{ socle }}
          2>/dev/null || true
      changed_when: false

    - name: Retirer le cache de construction, qui survivrait aux images
      ansible.builtin.shell:
        cmd: docker builder prune -af || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer l'atelier entier, Dockerfile corrigé compris, et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
