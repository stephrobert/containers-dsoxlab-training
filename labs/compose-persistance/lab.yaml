id: compose-persistance                      # REQUIS
title: "Keep application data across Compose recreation"
level: c3                     # REQUIS
description: "Use a named volume and prove that new writes survive container replacement and Compose down/up."
skills:                       # REQUIS, non vide
  - compose-volumes
  - data-persistence
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/#concepts-clés   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
