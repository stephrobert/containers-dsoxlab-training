---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab compose-persistance
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Docker et Compose
      ansible.builtin.apt:
        name: [docker.io, docker-compose]
        state: present
        update_cache: true
    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true
    - name: Créer le contexte
      ansible.builtin.file:
        path: /opt/lab-compose-persist
        state: directory
        mode: "0755"
    - name: Tirer la donnée initiale
      ansible.builtin.set_fact:
        value: "seed-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters']) }}"
    - name: Déposer la donnée initiale
      ansible.builtin.copy:
        dest: /opt/lab-compose-persist/value.txt
        content: "{{ value }}\n"
        mode: "0644"
    - name: Déposer le Dockerfile
      ansible.builtin.copy:
        dest: /opt/lab-compose-persist/Dockerfile
        mode: "0644"
        content: |
          FROM alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
          LABEL dsoxlab.lab="compose-persistance"
          COPY value.txt /seed/value.txt
          CMD ["sh", "-c", "mkdir -p /data; test -f /data/value.txt || cp /seed/value.txt /data/value.txt; exec sleep infinity"]
    - name: Construire l'image
      ansible.builtin.command:
        cmd: docker build -t dsoxlab-compose-persist:app /opt/lab-compose-persist
      changed_when: true
    - name: Garder la valeur attendue
      ansible.builtin.copy:
        dest: /root/.lab-compose-persist.json
        content: "{{ {'value': value} | to_json }}"
        mode: "0600"
    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
