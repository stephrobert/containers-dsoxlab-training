# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER NE NOMME AUCUN CHEMIN : il dit que les quatre chemins déclarés
# n'ont pas le même rôle, et laisse les reconnaître. C'est la compétence
# mesurée, et elle survit au changement de pilote, là où un nom appris ne
# survivrait pas.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Il commence par un
# PIÈGE D'OUTIL, ce qui est inhabituel ici : `truncate` et `fallocate` créent un
# fichier qui n'occupe aucun bloc, et la pesée le compte pour zéro. Ce n'est pas
# une faute de raisonnement, c'est un outil qui ne fait pas ce qu'il semble
# faire, et le laisser chercher n'enseignerait rien du sujet.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-stockage.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
