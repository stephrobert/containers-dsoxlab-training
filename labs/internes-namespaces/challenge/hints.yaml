# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# AUCUN NE NOMME LE NAMESPACE PARTAGÉ, et c'est une décision. C'est la seule
# chose de ce lab qui s'apprenne par cœur, et l'écrire ici en priverait
# l'apprenant pour toujours. Les indices donnent donc la MÉTHODE de comparaison,
# jusqu'à la boucle exacte, et le quatrième se contente de dire que la réponse
# ne se devine pas mais se mesure.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici la plus
# fréquente est d'avoir répondu le PID 1, celui que le conteneur voit, à une
# question qui demande celui de l'hôte.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-namespaces.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
