---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# `indiscret` EST RETIRÉ ALORS QUE LE SETUP NE LE CRÉE PAS : c'est l'apprenant
# qui le lance, et le laisser derrière rendrait le quatrième contrôle vrai au
# passage suivant avant tout travail.
#
# RIEN D'AUTRE À NETTOYER, et c'est notable : ce lab ne crée ni volume, ni
# réseau, ni image. Il ne fait que regarder, ce qui est exactement son sujet.
- name: Défaire le lab internes-namespaces
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    tag_local: lab-namespaces:1.0
    atelier: /opt/lab-namespaces
  tasks:
    - name: Retirer les deux conteneurs, celui du setup et celui de l'apprenant
      ansible.builtin.shell:
        cmd: docker rm -f cloisonne indiscret 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} {{ image_epinglee }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de travail, les réponses et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
