title: "Un namespace est une vue, pas un mur"
description: "Retrouver sur l'hôte le processus qu'un conteneur appelle PID 1, lire les namespaces que le noyau lui a donnés, et découvrir par comparaison celui que Docker n'isole pas : la raison pour laquelle root dans un conteneur est un sujet de sécurité."
