---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab registry-tag-push-pull
  hosts: lab_target
  become: true
  tasks:
    - name: Noter si le socle public etait deja present
      # UN LAB NE REND QUE CE QU'IL A POSE, et il rend tout ce qu'il a pose. Ce
      # lab TIRAIT le socle sans jamais le retirer : le validateur comptait
      # « image laisse », et le lab suivant heritait d'un moteur modifie. Le
      # marqueur dit au cleanup s'il doit rendre l'image, ou la laisser parce
      # qu'elle etait deja la.
      ansible.builtin.shell: |
        set -eu
        if docker image inspect 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1; then
          rm -f '/var/tmp/dsoxlab-registry-tag-push-pull.socle-a-rendre'
        else
          : > '/var/tmp/dsoxlab-registry-tag-push-pull.socle-a-rendre'
        fi
      changed_when: false

    - name: Installer le moteur et le client indépendant
      ansible.builtin.apt:
        name: [docker-ce, docker-buildx-plugin, skopeo]
        state: present
        update_cache: true

    - name: Démarrer Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Autoriser le compte apprenant
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true

    - name: Retirer le registre d'un passage précédent
      ansible.builtin.shell:
        cmd: |
          set -eu
          if docker container inspect dsoxlab-registry-push >/dev/null 2>&1; then
            docker rm -f dsoxlab-registry-push
          fi
      changed_when: false

    - name: Retirer les fichiers d'un passage précédent
      ansible.builtin.file:
        path: /opt/lab-registry-push
        state: absent

    - name: Créer le contexte et le stockage du registre
      ansible.builtin.file:
        path: "/opt/lab-registry-push/{{ item }}"
        state: directory
        mode: "0755"
      loop: [appli, registry]

    - name: Tirer la release du jour
      ansible.builtin.set_fact:
        release: "release-{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"

    - name: Déposer le produit à distribuer
      ansible.builtin.copy:
        dest: /opt/lab-registry-push/appli/release.txt
        content: "{{ release }}\n"
        mode: "0644"

    - name: Déposer le Dockerfile de la release
      ansible.builtin.copy:
        dest: /opt/lab-registry-push/appli/Dockerfile
        mode: "0644"
        content: |
          FROM alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          LABEL dsoxlab.lab="registry-tag-push-pull"
          COPY release.txt /release.txt
          CMD ["cat", "/release.txt"]

    - name: Construire la release seulement en local
      ansible.builtin.command:
        cmd: docker build -t dsoxlab-registry-app:release /opt/lab-registry-push/appli
      changed_when: true

    - name: Lire l'identité de l'image de référence
      ansible.builtin.command:
        cmd: docker image inspect dsoxlab-registry-app:release --format '{% raw %}{{.Id}}{% endraw %}'
      register: reference
      changed_when: false

    - name: Garder le relevé de référence
      ansible.builtin.copy:
        dest: /root/.lab-registry-push.json
        content: "{{ {'image': reference.stdout | trim, 'release': release} | to_json }}"
        mode: "0600"

    - name: Tirer le registre épinglé
      ansible.builtin.command:
        cmd: docker pull registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
      register: registry_pull
      changed_when: "'Downloaded newer image' in registry_pull.stdout"

    - name: Démarrer le registre vide sur la boucle locale
      ansible.builtin.command:
        cmd: >-
          docker run -d --name dsoxlab-registry-push
          -p 127.0.0.1:15000:5000
          -v /opt/lab-registry-push/registry:/var/lib/registry
          registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
      changed_when: true

    - name: Attendre le registre
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 15000
        timeout: 20

    - name: Déposer la mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/MISSION.md
        mode: "0644"
