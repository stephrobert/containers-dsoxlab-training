---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab registry-tag-push-pull
  hosts: lab_target
  become: true
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-registry-tag-push-pull.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-registry-tag-push-pull.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer uniquement les conteneurs et images du lab
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          for container in dsoxlab-registry-push dsoxlab-registry-consumer; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              docker rm -f "$container"
            fi
          done
          for image in dsoxlab-registry-app:release 127.0.0.1:15000/catalogue/appli:1.0 dsoxlab-registry:consumer; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm -f "$image"
            fi
          done
          images=$(docker image ls -aq --filter label=dsoxlab.lab=registry-tag-push-pull)
          if test -n "$images"; then docker image rm -f $images; fi
      changed_when: false

    - name: Retirer les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-registry-push
        - /root/.lab-registry-push.json
        - /opt/MISSION.md
