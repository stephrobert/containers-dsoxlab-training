---
- name: Remove only the privilege exercise
  hosts: lab_target
  become: true
  vars:
    lab: securite-no-new-privileges
    work: /opt/dsoxlab-securite-no-new-privileges
    image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  tasks:
    - name: Remove jointly labelled containers and the dedicated image
      ansible.builtin.shell: |
        set -eu
        for id in $(docker ps -aq --filter label=dsoxlab.lab={{ lab }} --filter label=com.docker.compose.project=dsoxlab-{{ lab }}); do docker rm -f "$id" >/dev/null; done
        for pass in 1 2 3; do
          ids="$(docker image ls -aq --filter label=dsoxlab.lab={{ lab }})"
          test -n "$ids" || break
          docker image rm $ids >/dev/null 2>&1 || true
        done
        test -z "$(docker image ls -aq --filter label=dsoxlab.lab={{ lab }})"
        if test -e "{{ work }}" || test -L "{{ work }}"; then
          test -d "{{ work }}" && test ! -L "{{ work }}"
          test "$(cat "{{ work }}/.owner")" = "{{ lab }}"
          if test -e "{{ work }}/.image-owned"; then docker image rm "{{ image }}" >/dev/null 2>&1 || true; fi
        fi
      changed_when: true
    - name: Remove the owned workspace
      ansible.builtin.file:
        path: "{{ work }}"
        state: absent
