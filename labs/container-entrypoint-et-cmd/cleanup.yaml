---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# CE QU'IL FAUT VRAIMENT DÉFAIRE. Les quatre conteneurs de l'apprenant, les
# deux images construites, et l'image de base tirée par son digest. Retirer
# seulement les tags laisserait des entrées sans nom dans l'inventaire du
# moteur, donc un écart que le validateur refuse.
#
# ON NE TOUCHE PAS À `debian:13`, dont un autre lab du catalogue a besoin : un
# lab qui nettoie l'état d'un autre est une panne qui se découvre ailleurs.
- name: Défaire le lab container-entrypoint-et-cmd
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    travail: /opt/lab-entrypoint
  tasks:
    - name: Retirer les quatre conteneurs de la mission
      ansible.builtin.shell:
        cmd: docker rm -f defaut remplace complete contourne 2>/dev/null || true
      changed_when: false

    - name: Retirer les deux images construites, puis l'image de base
      ansible.builtin.shell:
        cmd: >
          docker rmi -f img-cmd:1.0 img-entrypoint:1.0 {{ image_epinglee }}
          2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines laissées par les deux constructions
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de travail et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ travail }}"
        - /opt/MISSION.md
