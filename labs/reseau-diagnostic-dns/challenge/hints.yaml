# Indices du challenge, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au
# plus explicite.
#
# C'EST UNE ÉPREUVE, et le dosage n'est donc pas celui d'un lab. Le premier
# indice ne nomme AUCUNE cause : il nomme la méthode de diagnostic, qui est la
# compétence mesurée, et il rappelle de ne pas toucher au client quand le
# serveur est en cause. Les causes n'apparaissent qu'au troisième.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici il nomme les
# CORRECTIONS INCOMPLÈTES, qui sont le vrai danger d'une épreuve de diagnostic :
# le renommage qui passe trois contrôles sur quatre, le rattachement qui oublie
# la publication, et la recréation qui écrase l'écouteur.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-diagnostic.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
