---
- name: Retirer seulement les ressources de l'épreuve réseau et données
  hosts: lab_target
  become: true
  tasks:
    - name: Retirer les objets identifiés, sans prune ni suppression étrangère
      ansible.builtin.shell:
        cmd: |
          set -eu
          ids=$(docker ps -aq --filter label=dsoxlab.lab=reseau-diagnostic-dns)
          if test -n "$ids"; then docker rm -f $ids; fi
          ids=$(docker network ls -q --filter label=dsoxlab.lab=reseau-diagnostic-dns)
          if test -n "$ids"; then docker network rm $ids; fi
          ids=$(docker volume ls -q --filter label=dsoxlab.lab=reseau-diagnostic-dns)
          if test -n "$ids"; then docker volume rm $ids; fi
          ids=$(docker image ls -q --filter label=dsoxlab.lab=reseau-diagnostic-dns)
          if test -n "$ids"; then docker image rm $ids; fi
      changed_when: false
    - name: Examiner le marqueur de cache préparé
      ansible.builtin.stat:
        path: /root/.lab-diagnostic-state.json
      register: diagnostic_state
    - name: Retirer seulement la base introduite, si aucun autre usage ne la retient
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          state = json.loads(Path("/root/.lab-diagnostic-state.json").read_text())
          reference = "alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f"
          found = subprocess.run(["docker", "image", "inspect", reference], capture_output=True, text=True)
          if found.returncode == 0:
              image_id = json.loads(found.stdout)[0]["Id"]
              if image_id not in state["images"]:
                  subprocess.run(["docker", "image", "rm", reference], check=True)
          elif found.returncode != 1 or "No such image" not in found.stderr:
              raise SystemExit(found.stderr)
          else:
              print("Diagnostic base is already absent")
          PY
      when: diagnostic_state.stat.exists
      changed_when: false
    - name: Retirer seulement les fichiers préparés
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/opt/lab-diagnostic, /root/.lab-diagnostic-state.json, /opt/MISSION.md]
