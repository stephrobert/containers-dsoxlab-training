# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER DIT L'ORDRE, et il dit surtout la conséquence à tirer : deux uid
# différents, donc aucun propriétaire possible. C'est le raisonnement du lab, et
# le nommer sans donner la commande est exactement ce qu'un indice de premier
# niveau doit faire.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Il commence par le
# `777`, qui fait passer trois contrôles sur quatre, et il nomme ensuite
# l'oubli du setgid, qui ne se voit que sur le propriétaire des fichiers créés.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-permissions.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
