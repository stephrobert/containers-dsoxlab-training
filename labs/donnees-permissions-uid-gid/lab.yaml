# Lab donnees-permissions-uid-gid. Les champs marqués REQUIS sont exigés par le validator :
# sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: donnees-permissions-uid-gid                      # REQUIS
title: "Two containers, one volume, rights that hold"            # REQUIS
level: c1                     # REQUIS
description: "A volume belongs to root and a non-root container cannot write to it. Replace the two usual bad answers, running as root and opening the volume to everyone, with the one that holds: aligning the shared group."
skills:                       # REQUIS, non vide
  - docker
  - volumes
  - permissions
  - non-root
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/volumes/#les-volumes-standards   # REQUIS, http(s)
lab_type: lab
estimated_time: 40m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: true
  persistence_after_reboot: false
