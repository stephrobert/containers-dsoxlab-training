# Lab compose-retour-arriere. Le lab est ecrit, mesure sur la machine et atteste :
# l'en-tete qui disait « scenario, setup et tests restent a ecrire » datait de sa
# planification, le 2026-11-01, et il est reste apres coup. Un commentaire qui
# decrit un etat passe est pire qu'absent, il fait douter du reste du fichier.
id: compose-retour-arriere
title: Roll back a release, and refuse the one that would lose data
# `c4` ET NON `c3` : la fiche C33 de la formation est au niveau c4, et c'est elle
# qui decide. Le niveau sert la PROGRESSION, donc un lab range trop tot est
# propose a un apprenant qui n'a pas ses prerequis, et il echoue pour une raison
# qui n'est pas la sienne.
level: c4
description: 'Deploy a release by its digest, roll back without losing the record written meanwhile,
  then establish that a second rollback is impossible: the schema migration is irreversible, and
  the previous release can no longer read it.'
skills:
- docker
- compose
- retour-arriere
- migration
- digest
distros:
- debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/orchestrateurs/docker-compose/mettre-a-jour-et-revenir-en-arriere/
lab_type: lab
estimated_time: 45m
runtime:
  type: vm
  targets:
  - name: cible
    host: docker.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
