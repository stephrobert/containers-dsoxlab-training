services:
  gateway:
    image: python:3.13.8-slim-bookworm@sha256:61169c2bdb8e6bb44a8dfad33f569d324d52f079fded9a204b322a6fb9c9f799
    command: ["python", "/app/service.py"]
    environment:
      ROLE: gateway
      CORRELATE: "0"
      SAFE_LOGS: "0"
    volumes: [".:/app:ro"]
    ports: ["127.0.0.1::8080"]
    labels: {dsoxlab.lab: compose-correlation-et-saturation}
  worker:
    image: python:3.13.8-slim-bookworm@sha256:61169c2bdb8e6bb44a8dfad33f569d324d52f079fded9a204b322a6fb9c9f799
    command: ["python", "/app/service.py"]
    environment:
      ROLE: worker
      CORRELATE: "0"
      SAFE_LOGS: "0"
    volumes: [".:/app:ro"]
    labels: {dsoxlab.lab: compose-correlation-et-saturation}
networks:
  default:
    labels: {dsoxlab.lab: compose-correlation-et-saturation}
