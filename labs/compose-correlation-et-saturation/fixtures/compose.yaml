services:
  gateway:
    image: python:3.14.10-slim-trixie@sha256:3cabfd7d7aaf394e6040e79fa1eec6ca1c52b74ed9188650472695d9a9326999
    command: ["python", "/app/service.py"]
    environment:
      ROLE: gateway
      CORRELATE: "0"
      SAFE_LOGS: "0"
    volumes: [".:/app:ro"]
    ports: ["127.0.0.1::8080"]
    labels: {dsoxlab.lab: compose-correlation-et-saturation}
  worker:
    image: python:3.14.10-slim-trixie@sha256:3cabfd7d7aaf394e6040e79fa1eec6ca1c52b74ed9188650472695d9a9326999
    command: ["python", "/app/service.py"]
    environment:
      ROLE: worker
      CORRELATE: "0"
      SAFE_LOGS: "0"
    volumes: [".:/app:ro"]
    labels: {dsoxlab.lab: compose-correlation-et-saturation}
networks:
  default:
    labels: {dsoxlab.lab: compose-correlation-et-saturation}
