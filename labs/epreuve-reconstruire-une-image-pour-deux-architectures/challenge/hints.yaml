# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE PREMIER INDICE POSE LES DEUX QUESTIONS QUI DÉCIDENT DE TOUT : « en ai-je
# besoin pour exécuter ou seulement pour construire ? » et « ce que je passe au
# moment de construire, où atterrit-il ? » Elles ne nomment aucun mécanisme, et
# elles couvrent trois des cinq contrôles.
#
# LE TROISIÈME DÉCRIT LES MÉCANISMES SANS LES NOMMER LITTÉRALEMENT, ce qui est
# volontaire sur cette épreuve : les noms d'options sont la réponse elle-même, et
# un indice à 20 points doit laisser l'apprenant les retrouver. Il nomme en
# revanche les DEUX réglages que personne ne devine, le réseau du constructeur
# et l'acceptation du HTTP, parce qu'ils ne s'apprennent pas en réfléchissant.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-docs-multiarch.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
