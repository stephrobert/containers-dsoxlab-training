# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite, et aucun ne donne la réponse.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Ici la faute
# centrale du lab, `vitrine` supprimé au lieu d'être arrêté, et le moyen de
# s'en remettre.
#
# Lab d'entrée du catalogue : les indices restent courts et concrets. Un
# débutant qui demande de l'aide au premier lab ne veut pas d'un exposé.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-premier-conteneur.py`) puis encodés : un indice écrit
# directement en base64 ne se relit pas, et c'est ainsi que deux labs d'un
# catalogue frère ont été livrés avec les indices du générateur.
