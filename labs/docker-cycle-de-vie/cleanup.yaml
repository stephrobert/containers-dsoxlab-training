---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# UN CONTENEUR EN PAUSE NE SE SUPPRIME PAS COMME UN AUTRE. `docker rm` refuse
# un conteneur gelé, et `docker rm -f` le prend. C'est la raison du `-f` ici, et
# elle vaut d'être écrite : sans lui, le `clean` échouerait exactement sur le
# lab dont le sujet est la mise en pause, et le message parlerait d'un refus
# sans dire pourquoi.
#
# TROIS NOMS, DONT UN QUE LE SETUP NE CRÉE PAS. `sortie` est le conteneur de
# l'apprenant : le laisser derrière ferait hériter le lab suivant d'un état
# qu'il n'a pas posé.
- name: Défaire le lab docker-cycle-de-vie
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    tag_local: lab-cycle:1.0
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-docker-cycle-de-vie.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-docker-cycle-de-vie.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer les trois conteneurs, en pause ou non
      ansible.builtin.shell:
        cmd: docker rm -f dormeur actif sortie 2>/dev/null || true
      changed_when: false

    - name: Retirer le tag local, puis l'image par son digest
      ansible.builtin.shell:
        cmd: docker rmi -f {{ tag_local }} 2>/dev/null || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer le répertoire de l'empreinte et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/lab-cycle
        - /opt/MISSION.md
