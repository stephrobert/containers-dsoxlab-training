services:
  worker:
    image: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    labels:
      dsoxlab.lab: troubleshoot-disque-plein
    network_mode: none
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 16
    cpus: 0.25
    cap_drop: [ALL]
    tmpfs:
      - /sandbox:rw,noexec,nosuid,size=16m
    command: ["sh", "-c", "printf 'keep-this-receipt\\n' > /sandbox/keep.txt; dd if=/dev/zero of=/sandbox/fill.bin bs=1M count=16 2>/dev/null || true; touch /run/fill-complete; while :; do sleep 3600; done"]
