id: troubleshoot-disque-plein
title: "Recover space in a bounded ENOSPC sandbox"
level: c4
description: "Diagnose and reclaim space in a hard-capped 16 MiB container filesystem without exhausting a host partition."
skills:
  - docker
  - disk-usage
  - volume-cleanup
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/daemon-config/#optimisations-production
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
