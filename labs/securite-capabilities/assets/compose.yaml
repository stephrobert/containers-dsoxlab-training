services:
  worker:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    labels:
      dsoxlab.lab: securite-capabilities
    network_mode: none
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    cpus: 0.25
    command:
      - sh
      - -c
      - |
        touch /proof
        mkdir -p /cellule/bin /cellule/lib /run/lanceur
        cp /bin/busybox /cellule/bin/busybox
        cp /lib/ld-musl-*.so.1 /cellule/lib/
        if ! chroot /cellule /bin/busybox true; then
          echo "le lanceur ne peut pas confiner ses travaux" >&2
          exit 1
        fi
        n=0
        while :; do
          chroot /cellule /bin/busybox true || exit 1
          n=$$((n + 1))
          echo "ok $$n" > /run/lanceur/etat
          sleep 1
        done
