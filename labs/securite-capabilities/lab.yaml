id: securite-capabilities
title: "Give a service back the one capability it really needs"
level: c6
description: "Recreate a service that stops when every capability is dropped, giving back only the one it needs, without privileged mode and without a superfluous capability, and prove what it can no longer do."
skills:
  - docker
  - capabilities
  - least-privilege
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/securite/#mettre-en-pratique
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:
    - name: cible
      host: docker.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
