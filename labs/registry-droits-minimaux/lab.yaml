# Lab registry-droits-minimaux. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: registry-droits-minimaux                      # REQUIS
title: "Grant minimal registry scopes to a publisher and a separate reader"
level: c2
description: "Correct a token service ACL, publish over verified TLS and pull the exact digest on a second Docker host while denying reader uploads."
skills:                       # REQUIS, non vide
  - docker
  - registry
  - authorization
  - tls
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/registres/#4-séparer-les-droits-pullpush
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab
      roles:
        reader: docker-client.lab
        publisher: docker.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
