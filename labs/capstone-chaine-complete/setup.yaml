---
- name: Prepare safely isolated delivery capstone
  hosts: lab_target
  become: true
  tasks:
    - name: Install runtime
      ansible.builtin.apt:
        name: [docker.io, docker-buildx, docker-compose, python3, coreutils, iproute2]
        state: present
        update_cache: true
    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Grant Docker access
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true
    - name: Require free lab loopback ports
      ansible.builtin.shell:
        cmd: |
          set -eu
          occupied=$(ss -H -ltn '( sport = :15088 or sport = :18088 )')
          if test -n "$occupied"; then
            echo "Ports 15088/18088 are occupied; do not stop unrelated services." >&2
            exit 1
          fi
      changed_when: false
    - name: Create workspace
      ansible.builtin.file:
        path: /opt/lab-delivery
        state: directory
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0755"
    - name: Copy source and incident harness
      ansible.builtin.copy:
        src: fixtures/
        dest: /opt/lab-delivery/
        owner: "{{ ansible_user | default('ansible') }}"
        mode: preserve
    - name: Record preexisting base images
      ansible.builtin.command:
        cmd: /usr/bin/python3 /opt/lab-delivery/base-cache.py snapshot
      changed_when: false
    - name: Seed pinned images
      ansible.builtin.command:
        cmd: docker pull {{ item }}
      loop:
        - python:3.13.8-slim-bookworm@sha256:61169c2bdb8e6bb44a8dfad33f569d324d52f079fded9a204b322a6fb9c9f799
        - postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        - registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      changed_when: true
    - name: Start lab-only loopback registry
      ansible.builtin.command:
        cmd: >-
          docker run -d --name dsoxlab-delivery-registry
          --label dsoxlab.lab=capstone-chaine-complete
          -p 127.0.0.1:15088:5000
          -v /opt/lab-delivery/registry:/var/lib/registry
          registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      changed_when: true
    - name: Copy mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/lab-delivery/MISSION.md
        mode: "0644"
    - name: Create a dedicated source-to-restore SSH key
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N "" -f /opt/lab-delivery/restore-key
        creates: /opt/lab-delivery/restore-key
    - name: Read the restore public key
      ansible.builtin.command:
        cmd: cat /opt/lab-delivery/restore-key.pub
      register: restore_public_key
      changed_when: false
    - name: Restrict the transport key to the lab learner
      ansible.builtin.file:
        path: /opt/lab-delivery/restore-key
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0600"
    - name: Record the distinct restore VM address
      ansible.builtin.copy:
        dest: /opt/lab-delivery/restore-host
        content: "{{ hostvars[groups['lab_restore'][0]].ansible_host }}\n"
        mode: "0644"

- name: Prepare a fresh distinct VM for application restoration
  hosts: lab_restore
  become: true
  tasks:
    - name: Require the restore port to be unused
      ansible.builtin.shell:
        cmd: |
          set -eu
          test -z "$(ss -H -ltn 'sport = :18089')" || {
            echo "Restore port 18089 is already occupied." >&2
            exit 1
          }
      changed_when: false
    - name: Require an unused dedicated restore account
      ansible.builtin.command:
        cmd: getent passwd dsoxlab-delivery-restore
      register: restore_account
      changed_when: false
      failed_when: restore_account.rc == 0
    - name: Create the dedicated archive transfer account
      ansible.builtin.user:
        name: dsoxlab-delivery-restore
        comment: "dsoxlab capstone restore transport"
        groups: docker
        append: true
        home: /var/lib/dsoxlab-delivery-restore
        create_home: true
        shell: /bin/sh
    - name: Create the restore workspace
      ansible.builtin.file:
        path: /opt/lab-delivery
        state: directory
        owner: dsoxlab-delivery-restore
        mode: "0755"
    - name: Mark the transfer account as lab-owned
      ansible.builtin.file:
        path: /opt/lab-delivery/restore-account-owned
        state: touch
        mode: "0600"
    - name: Authorize only the dedicated source key
      ansible.posix.authorized_key:
        user: dsoxlab-delivery-restore
        key: "{{ hostvars[groups['lab_target'][0]].restore_public_key.stdout }}"
        key_options: "no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty"
    - name: Copy the existing base-image cache helper
      ansible.builtin.copy:
        src: fixtures/base-cache.py
        dest: /opt/lab-delivery/base-cache.py
        mode: "0644"
    - name: Record the restore VM base images
      ansible.builtin.command:
        cmd: /usr/bin/python3 /opt/lab-delivery/base-cache.py snapshot
      changed_when: false
    - name: Seed only the pinned PostgreSQL restore runtime
      ansible.builtin.command:
        cmd: docker pull postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      changed_when: true
