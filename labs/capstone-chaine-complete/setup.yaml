---
- name: Prepare safely isolated delivery capstone
  hosts: lab_target
  become: true
  tasks:
    - name: Install runtime
      ansible.builtin.apt:
        name: [docker.io, docker-buildx, docker-compose, python3, coreutils, iproute2]
        state: present
        update_cache: true
    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Grant Docker access
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true
    - name: Require free lab loopback ports
      ansible.builtin.shell:
        cmd: |
          set -eu
          occupied=$(ss -H -ltn '( sport = :15088 or sport = :18088 )')
          if test -n "$occupied"; then
            echo "Ports 15088/18088 are occupied; do not stop unrelated services." >&2
            exit 1
          fi
      changed_when: false
    - name: Create workspace
      ansible.builtin.file:
        path: /opt/lab-delivery
        state: directory
        owner: "{{ ansible_user | default('ansible') }}"
        mode: "0755"
    - name: Copy source and incident harness
      ansible.builtin.copy:
        src: fixtures/
        dest: /opt/lab-delivery/
        owner: "{{ ansible_user | default('ansible') }}"
        mode: preserve
    - name: Record preexisting base images
      ansible.builtin.command:
        cmd: /usr/bin/python3 /opt/lab-delivery/base-cache.py snapshot
      changed_when: false
    - name: Seed pinned images
      ansible.builtin.command:
        cmd: docker pull {{ item }}
      loop:
        - python:3.13.8-slim-bookworm@sha256:61169c2bdb8e6bb44a8dfad33f569d324d52f079fded9a204b322a6fb9c9f799
        - postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        - registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      changed_when: true
    - name: Start lab-only loopback registry
      ansible.builtin.command:
        cmd: >-
          docker run -d --name dsoxlab-delivery-registry
          --label dsoxlab.lab=capstone-chaine-complete
          -p 127.0.0.1:15088:5000
          -v /opt/lab-delivery/registry:/var/lib/registry
          registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      changed_when: true
    - name: Copy mission
      ansible.builtin.copy:
        src: "scenario{{ '.fr' if lookup('env', 'DSOXLAB_LANG') == 'fr' else '' }}.md"
        dest: /opt/lab-delivery/MISSION.md
        mode: "0644"
