services:
  api:
    image: ${API_IMAGE}
    labels:
      dsoxlab.lab: capstone-chaine-complete
    ports:
      - "127.0.0.1:18088:8080"
    environment:
      DB_HOST: db
    depends_on:
      - db
  db:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    labels:
      dsoxlab.lab: capstone-chaine-complete
    environment:
      POSTGRES_USER: delivery
      POSTGRES_DB: delivery
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
secrets:
  db_password:
    file: ./db-password
networks:
  default:
    labels:
      dsoxlab.lab: capstone-chaine-complete
