# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# CE LAB N'A PAS DE FORMULAIRE, donc aucune valeur à ne pas donner : la réponse
# est un Dockerfile, et c'est son ORDRE qui est la compétence. Le générateur
# vérifie donc autre chose : que les deux premiers indices ne livrent ni le
# Dockerfile réordonné ni le nom du fichier d'exclusion.
#
# LE PREMIER NE DONNE AUCUNE RÈGLE : il demande de MESURER d'abord, puis pose
# la seule phrase dont tout le reste découle, et laisse chercher de quoi chaque
# étape dépend. C'est le raisonnement du lab, et il vaut plus qu'un Dockerfile
# recopié.
#
# LE DEUXIÈME DIT LE PIÈGE SYMÉTRIQUE, et c'est délibéré : copier le manifeste
# après l'installation rend le troisième contrôle vert et fige l'image sur
# d'anciennes dépendances. Laisser l'apprenant y tomber lui ferait apprendre la
# faute la plus coûteuse des deux.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa deuxième cause
# est celle qu'on ne soupçonne pas : avoir retiré l'installation, ce qui rend
# le cache parfait et l'image inutile.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-couches.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
