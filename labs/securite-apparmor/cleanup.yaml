---
- name: Unload only the dedicated lab profile after removing its containers
  hosts: lab_target
  become: true
  vars:
    lab: securite-apparmor
    work: /opt/dsoxlab-securite-apparmor
    image: alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  tasks:
    - name: Remove the lab containers and only the profile owned by this run
      ansible.builtin.shell: |
        set -eu
        for id in $(docker ps -aq --filter label=dsoxlab.lab={{ lab }} --filter label=com.docker.compose.project=dsoxlab-{{ lab }}); do docker rm -f "$id" >/dev/null; done
        if test -e "{{ work }}" || test -L "{{ work }}"; then
          test -d "{{ work }}" && test ! -L "{{ work }}"
          test "$(cat "{{ work }}/.owner")" = "{{ lab }}"
          if grep -q '^dsoxlab-securite-apparmor ' /sys/kernel/security/apparmor/profiles; then
            printf 'profile dsoxlab-securite-apparmor { }\n' | apparmor_parser --skip-cache -R
          fi
          if test -e "{{ work }}/.image-owned"; then docker image rm "{{ image }}" >/dev/null 2>&1 || true; fi
        fi
      changed_when: true
    - name: Remove the owned workspace
      ansible.builtin.file:
        path: "{{ work }}"
        state: absent
