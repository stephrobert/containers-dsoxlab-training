services:
  worker:
    image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    labels:
      dsoxlab.lab: securite-apparmor
    network_mode: none
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    cpus: 0.25
    cap_drop: [ALL]
    security_opt:
      - apparmor:unconfined
    command: ["sh", "-c", "mkdir -p /lab; printf public > /lab/public.txt; printf pedagogic > /lab/private.txt; chmod 444 /lab/*.txt; while :; do sleep 3600; done"]
