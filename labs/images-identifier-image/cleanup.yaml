---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# CE QU'IL FAUT VRAIMENT DÉFAIRE. Retirer le seul fichier de réponse ne suffit
# pas : les deux images construites sous le même tag restent dans le cache du
# démon, et un second passage les retrouverait telles quelles. Le piège du lab
# serait alors déjà résolu avant d'être posé, et le `check` passerait au vert
# sans que personne n'ait rien fait. On retire donc les images AUSSI.
- name: Défaire le lab images-identifier-image
  hosts: lab_target
  become: true
  tasks:
    - name: Retirer le tag construit deux fois
      ansible.builtin.shell:
        cmd: docker rmi -f inventaire:1.0 || true
      changed_when: false

    - name: Retirer les couches orphelines laissées par les deux constructions
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Rendre debian seulement si ce lab l'a pose
      ansible.builtin.shell:
        cmd: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then exit 0; fi
          if test -f '/var/tmp/dsoxlab-images-identifier-image.socle-debian-a-rendre'; then
            docker image rm -f 'debian:13' >/dev/null 2>&1 || true
            rm -f '/var/tmp/dsoxlab-images-identifier-image.socle-debian-a-rendre'
          fi
      changed_when: false

    - name: Retirer le répertoire de travail et la réponse de l'apprenant
      ansible.builtin.file:
        path: /opt/lab-images
        state: absent
