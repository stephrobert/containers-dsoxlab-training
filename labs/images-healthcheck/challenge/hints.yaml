# Indices du lab, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas en
# ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# LE GARDE-FOU DU GÉNÉRATEUR vérifie que les deux premiers indices ne livrent ni
# l'instruction ni la commande de fraîcheur, et qu'AUCUN ne propose de sonder le
# processus ou la seule existence du fichier : ce sont les deux fausses sondes
# que le lab existe pour écarter, et les nommer comme des pistes les
# enseignerait.
#
# LE PREMIER FAIT FAIRE LA MANIPULATION, puis fait éliminer les deux fausses
# pistes par le raisonnement : le processus est là dans les deux cas, le fichier
# aussi. Il ne reste qu'une propriété, et elle se lit en comparant deux
# instants.
#
# LE DEUXIÈME DIT QUE LA SONDE VIT DANS L'IMAGE, parce qu'une sonde passée en
# option de lancement ne part pas avec elle, et donne la raison de chacune des
# quatre bornes, dont deux seulement sont notées : le délai d'attente n'en
# fait pas partie, et l'indice dit pourquoi.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer
# ce qui montre la faute quand tout semble juste sans l'être. Sa dernière ligne
# écarte une attente légitime mais fausse : le moteur n'arrête pas un conteneur
# malade.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-sante.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
