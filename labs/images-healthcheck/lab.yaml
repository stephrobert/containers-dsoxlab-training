# Lab images-healthcheck. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: images-healthcheck                      # REQUIS
title: "'Up' says nothing about the service"   # REQUIS
level: c5                     # REQUIS
description: "A service goes quiet without dying, and its container says so. It also says when the service starts again."
skills:                       # REQUIS, non vide
  - docker
  - dockerfile
  - supervision
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/images-conteneurs/tester-une-image/#mettre-en-pratique   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
