---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# LE CONTENEUR PART AVANT L'IMAGE, et le marqueur de mutisme part avec lui : il
# vit dans le conteneur, donc le retrait du conteneur suffit. Rien à nettoyer
# sur l'hôte de ce côté.
- name: Défaire le lab images-healthcheck
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    socle: lab-sante:1.0
    atelier: /opt/lab-sante
  tasks:
    - name: Retirer le conteneur du lab et les conteneurs d'essai
      ansible.builtin.shell:
        cmd: >
          docker rm -f service-surveille dsoxlab-essai-sante
          dsoxlab-essai-solution-sante
          2>/dev/null || true
      changed_when: false

    - name: Retirer les conteneurs dérivés de l'image du lab
      ansible.builtin.shell:
        cmd: >
          docker ps -aq --filter ancestor=appli:surveillee
          | xargs -r docker rm -f
          2>/dev/null || true
      changed_when: false

    - name: Retirer les images du lab, celle de l'apprenant et le socle
      ansible.builtin.shell:
        cmd: >
          docker rmi -f appli:surveillee {{ socle }} {{ image_epinglee }}
          2>/dev/null || true
      changed_when: false

    - name: Retirer le cache de construction, qui survivrait aux images
      ansible.builtin.shell:
        cmd: docker builder prune -af || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer l'atelier entier, Dockerfile sondé compris, et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
