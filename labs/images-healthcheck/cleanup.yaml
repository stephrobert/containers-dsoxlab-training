---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
#
# LE CONTENEUR PART AVANT L'IMAGE, et le marqueur de mutisme part avec lui : il
# vit dans le conteneur, donc le retrait du conteneur suffit. Rien à nettoyer
# sur l'hôte de ce côté.
- name: Défaire le lab images-healthcheck
  hosts: lab_target
  become: true
  vars:
    image_epinglee: >-
      alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    socle: lab-sante:1.0
    atelier: /opt/lab-sante
  tasks:
    - name: Rendre le socle public, et seulement si ce lab l'a tire
      # Voir la tache jumelle du setup : sans ce test, le lab retire une image
      # que d'autres partagent, ou laisse celle qu'il a tiree.
      ansible.builtin.shell: |
        set -eu
        if ! command -v docker >/dev/null 2>&1; then exit 0; fi
        if test -e '/var/tmp/dsoxlab-images-healthcheck.socle-a-rendre'; then
          docker image rm -f 'alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a' >/dev/null 2>&1 || true
          rm -f '/var/tmp/dsoxlab-images-healthcheck.socle-a-rendre'
        fi
      changed_when: false

    - name: Retirer le conteneur du lab et les conteneurs d'essai
      ansible.builtin.shell:
        cmd: >
          docker rm -f service-surveille dsoxlab-essai-sante
          dsoxlab-essai-solution-sante
          2>/dev/null || true
      changed_when: false

    - name: Retirer les conteneurs dérivés de l'image du lab
      ansible.builtin.shell:
        cmd: >
          docker ps -aq --filter ancestor=appli:surveillee
          | xargs -r docker rm -f
          2>/dev/null || true
      changed_when: false

    - name: Retirer les images du lab, celle de l'apprenant et le socle
      ansible.builtin.shell:
        cmd: >
          docker rmi -f appli:surveillee {{ socle }}
          2>/dev/null || true
      changed_when: false

    - name: Retirer le cache de construction, qui survivrait aux images
      ansible.builtin.shell:
        cmd: docker builder prune -af || true
      changed_when: false

    - name: Retirer les couches orphelines
      ansible.builtin.shell:
        cmd: docker image prune -f || true
      changed_when: false

    - name: Retirer l'atelier entier, Dockerfile sondé compris, et l'énoncé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ atelier }}"
        - /opt/MISSION.md
