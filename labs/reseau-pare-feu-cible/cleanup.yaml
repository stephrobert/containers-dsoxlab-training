---
- name: Remove only owned firewall laboratory resources
  hosts: lab_target
  become: true
  vars:
    work: /opt/dsoxlab-reseau-pare-feu-cible
  tasks:
    - name: Check the ownership record
      ansible.builtin.stat:
        path: "{{ work }}/.ownership.json"
      register: ownership
    - name: Remove owned Docker objects without global pruning
      ansible.builtin.command:
        cmd: python3 {{ work }}/lifecycle.py cleanup
      when: ownership.stat.exists
    - name: Remove only the recorded work directory
      ansible.builtin.file:
        path: "{{ work }}"
        state: absent
      when: ownership.stat.exists
    - name: Rendre le reglage des ponts tel qu'il etait
      ansible.builtin.shell: |
        set -eu
        reglage=/proc/sys/net/bridge/bridge-nf-call-iptables
        if [ -e /var/tmp/dsoxlab-reseau-pare-feu-cible.nf-call-a-rendre ]; then
          if [ -e "$reglage" ]; then echo 1 > "$reglage"; fi
          rm -f /var/tmp/dsoxlab-reseau-pare-feu-cible.nf-call-a-rendre
        fi
      changed_when: false
