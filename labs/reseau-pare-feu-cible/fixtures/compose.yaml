services:
  router:
    image: dsoxlab-reseau-pare-feu-cible-image
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    sysctls: {net.ipv4.ip_forward: "1"}
    environment: {ROLE: router, PORT: "8081"}
    volumes: ["./rules.nft:/rules.nft:ro"]
    networks:
      front: {ipv4_address: 172.30.201.254}
      back: {ipv4_address: 172.30.202.254}
    labels: {dsoxlab.lab: reseau-pare-feu-cible}
  allowed:
    image: dsoxlab-reseau-pare-feu-cible-image
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    environment: {ROLE: allowed}
    networks:
      front: {ipv4_address: 172.30.201.10}
    labels: {dsoxlab.lab: reseau-pare-feu-cible}
  denied:
    image: dsoxlab-reseau-pare-feu-cible-image
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    environment: {ROLE: denied}
    networks:
      front: {ipv4_address: 172.30.201.20}
    labels: {dsoxlab.lab: reseau-pare-feu-cible}
  server:
    image: dsoxlab-reseau-pare-feu-cible-image
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    environment: {ROLE: server}
    networks:
      back: {ipv4_address: 172.30.202.10}
    labels: {dsoxlab.lab: reseau-pare-feu-cible}
networks:
  front:
    ipam:
      config: [{subnet: 172.30.201.0/24}]
    labels: {dsoxlab.lab: reseau-pare-feu-cible}
  back:
    ipam:
      config: [{subnet: 172.30.202.0/24}]
    labels: {dsoxlab.lab: reseau-pare-feu-cible}
