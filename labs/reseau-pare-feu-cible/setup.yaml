---
- name: Prepare the namespace-only firewall laboratory
  hosts: lab_target
  become: true
  vars:
    work: /opt/dsoxlab-reseau-pare-feu-cible
  tasks:
    - name: Refuse a pre-existing work directory
      ansible.builtin.stat:
        path: "{{ work }}"
      register: existing
    - name: Protect pre-existing files
      ansible.builtin.assert:
        that: not existing.stat.exists
        fail_msg: "Work directory already exists; clean an owned lab first."
    - name: Install declared runtime tools
      ansible.builtin.apt:
        name: [docker-ce, docker-compose-plugin, python3, python3-yaml]
        state: present
        update_cache: true
    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
    - name: Laisser les ponts hors du pare-feu de l'hote, et noter ce qui etait regle
      # Docker charge br_netfilter des qu'un reseau demande enable_icc=false, et
      # le module reste charge apres le retrait de ce reseau. Les paquets routes
      # entre conteneurs passent alors par la chaine FORWARD de l'hote, qui les
      # jette : le lab devient insoluble. Mesure du 2026-11-25, Docker 29.9.2.
      ansible.builtin.shell: |
        set -eu
        reglage=/proc/sys/net/bridge/bridge-nf-call-iptables
        if [ -e "$reglage" ] && [ "$(cat "$reglage")" = 1 ]; then
          : > /var/tmp/dsoxlab-reseau-pare-feu-cible.nf-call-a-rendre
          echo 0 > "$reglage"
        fi
      changed_when: false
    - name: Authorize the learner account
      ansible.builtin.user:
        name: "{{ ansible_user | default('ansible') }}"
        groups: docker
        append: true
    - name: Copy the complete supplied fixture
      ansible.builtin.copy:
        src: fixtures/
        dest: "{{ work }}/"
        owner: "{{ ansible_user | default('ansible') }}"
        mode: preserve
    - name: Copy the shared owned-resource lifecycle from the new transaction lab
      ansible.builtin.copy:
        src: ../container-arret-transactionnel/fixtures/lifecycle.py
        dest: "{{ work }}/lifecycle.py"
        mode: "0644"
    - name: Record ownership, build the scoped tools image and start the faulty topology
      ansible.builtin.command:
        cmd: python3 {{ work }}/lifecycle.py setup
