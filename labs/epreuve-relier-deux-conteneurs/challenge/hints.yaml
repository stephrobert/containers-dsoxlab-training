# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UNE ÉPREUVE, et le dosage n'est donc pas celui d'un lab. Les deux
# premiers indices ne nomment AUCUNE cause : le premier donne la méthode et
# l'ordre des questions, qui sont la compétence mesurée, le second donne les
# commandes qui y répondent. Les causes n'apparaissent qu'au troisième.
#
# Le quatrième a un emploi précis, qui est la convention de ce dépôt : nommer ce
# qui montre la faute quand tout semble juste sans l'être. Ici il nomme les
# CORRECTIONS INCOMPLÈTES, qui sont le vrai danger d'une épreuve notée sur l'état
# final : la recréation qui oublie les variables, la publication sans adresse, le
# port retiré sans quitter le réseau par défaut, et le renommage au lieu de
# l'alias.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-relier.py`) puis encodés : un indice écrit directement en
# base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère ont
# été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
