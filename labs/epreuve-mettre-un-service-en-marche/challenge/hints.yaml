# Indices de l'épreuve, ENCODÉS EN BASE64 pour qu'un apprenant n'y accède pas
# en ouvrant le fichier. Quatre indices de coût croissant, du plus vague au plus
# explicite.
#
# C'EST UNE ÉPREUVE, et le dosage n'est donc pas celui d'un lab. Les deux
# premiers indices ne nomment AUCUNE cause : le premier donne la méthode et
# l'ordre des questions, le second les commandes qui y répondent. Les causes
# n'apparaissent qu'au troisième.
#
# LE PREMIER INDICE PORTE DÉJÀ L'AVERTISSEMENT sur les deux conteneurs, et c'est
# délibéré : l'exigence critique est annoncée dans l'énoncé, donc la rappeler
# dans l'indice le plus vague ne divulgue rien. Un apprenant qui prend un indice
# parce qu'il est bloqué ne doit pas y perdre l'épreuve entière.
#
# Le quatrième nomme les CORRECTIONS INCOMPLÈTES, convention de ce dépôt : ce
# qui montre la faute quand tout semble juste sans l'être. Trois des cinq qu'il
# cite échouent sur l'exigence critique.
#
# Pour relire un indice : echo '<texte>' | base64 -d
#
# Ils sont écrits EN CLAIR dans le scratchpad de session
# (`ecrire-hints-mise-en-marche.py`) puis encodés : un indice écrit directement
# en base64 ne se relit pas, et c'est ainsi que deux labs d'un catalogue frère
# ont été livrés avec les indices du générateur.
hints:
- cost: 10
  text_fr: 
  text_en: 
- cost: 15
  text_fr: 
  text_en: 
- cost: 20
  text_fr: 
  text_en: 
- cost: 25
  text_fr: 
  text_en: 
