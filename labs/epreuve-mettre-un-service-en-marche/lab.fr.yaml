# Surcharge française de l'épreuve epreuve-mettre-un-service-en-marche. Elle ne porte
# QUE `title`, `description` et les libellés `criteria` (`id`, `label`) : tout autre
# champ y est ignoré en silence, parce que le contrat ne se traduit pas.
title: "Rien ne tourne sur ce poste"
description: "Remettre un moteur arrêté et désactivé, faire parler le compte avec lui, lancer le service nommé avec sa configuration, et conserver le conteneur témoin intact."
criteria:
  - id: moteur-accessible
    label: "Le moteur est en marche et votre compte peut l'utiliser"
  - id: service-demande
    label: "Le service demandé tourne et répond avec la valeur configurée"
  - id: temoin-conserve
    label: "Le conteneur témoin de l'incident est conservé, journaux lisibles"
  - id: lancement-predit
    label: "Le programme et les arguments d'un lancement sont annoncés correctement"
