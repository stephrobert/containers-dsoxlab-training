# Épreuve epreuve-mettre-un-service-en-marche. Les champs marqués REQUIS sont exigés par
# le validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue
# sans un mot.
#
# `lab_type: challenge` et non `lab` : c'est ce qui autorise
# `exam_passing_score`, et ce qui dit à l'apprenant que cette épreuve ÉVALUE.
# Rien n'y est réexpliqué : les leçons du module l'ont enseigné, à savoir
# vérifier un moteur, lancer un conteneur nommé, lire ses journaux, et
# distinguer ce qu'un ENTRYPOINT garde de ce qu'un argument remplace.
id: epreuve-mettre-un-service-en-marche                      # REQUIS
title: "Nothing runs on this host"                     # REQUIS
level: c1                     # REQUIS
description: "Bring a stopped and disabled engine back, make the account talk to it, run the named service with its configuration, and keep the witness container untouched."
skills:                       # REQUIS, non vide
  - docker
  - systemd
  - exploitation
  - journaux
  - diagnostic
distros:                      # REQUIS, non vide
  - debian13
doc_url: https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/epreuves/mettre-un-service-en-marche/#passer-lépreuve
lab_type: challenge
exam_passing_score: 75
exam_blocking_checks:
  # L'exigence qu'aucun total ne compense, et que le moteur applique
  # depuis dsoxlab 0.7.0 : un echec ici refuse l'epreuve quel que soit
  # le score. Avant, quatre controles sur cinq donnaient 80, et 80
  # passait ce seuil de 75 : l'epreuve etait recue alors que son
  # exigence critique avait echoue.
  - test_le_temoin_est_conserve_arrete_et_ses_journaux_lisibles
# Critères : un nom stable et un libellé par capacité que l'épreuve mesure, et les
# leçons où la réviser. Le moteur ne les montre jamais pendant `check` (une épreuve
# ne donne rien) : le site les lit après l'envoi du résultat.
criteria:
  - id: moteur-accessible
    label: "The engine is running and your account can use it"
    tests:
      - test_le_moteur_tourne_est_active_et_le_compte_lui_parle
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/installation/
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/anatomie/
  - id: service-demande
    label: "The requested service runs and answers with its configured value"
    tests:
      - test_le_service_tourne_et_rend_la_valeur_demandee
      - test_l_ancien_conteneur_homonyme_a_disparu
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/cli/
  - id: temoin-conserve
    label: "The incident witness container is preserved with readable logs"
    tests:
      - test_le_temoin_est_conserve_arrete_et_ses_journaux_lisibles
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/cli/
  - id: lancement-predit
    label: "The program and arguments of a launch are announced correctly"
    tests:
      - test_la_prediction_annonce_le_programme_et_les_arguments_effectifs
    lessons:
      - https://www.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/cli/
estimated_time: 30m
runtime:
  type: vm
  targets:                    # REQUIS pour vm, non vide
    - name: cible
      host: docker.lab          # doit exister dans meta.yml: infra.hosts[]
  default: cible
validation:
  functional: true
  security: false
  persistence_after_reboot: true
